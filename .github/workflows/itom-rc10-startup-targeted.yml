name: RC10 isolated cold-capacity probe and recovery tests; no artifacts
on:
  push:
    branches: ["codex/v1.0.0-rc10-development"]
    paths: ["archives/1.0.0-rc10/experiments/cold64.py", "archives/1.0.0-rc10/experiments/escaped_ack.py", "archives/1.0.0-rc10/experiments/read2.py", ".github/workflows/itom-rc10-startup-targeted.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    name: ACK-released escape pacing, ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: early10
            profile: "10:10,20:10,50:10,150:30"
          - title: early20
            profile: "20:10,50:10,150:40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Apply isolated cold-probe experiment
        run: |
          python3 archives/1.0.0-rc10/experiments/cold64.py
          python3 archives/1.0.0-rc10/experiments/escaped_ack.py
          python3 archives/1.0.0-rc10/experiments/read2.py
      - name: Verify independent recovery before measuring startup
        working-directory: archives/1.0.0-rc10/source/core
        run: go test -p 2 -count=1 -timeout=180s ./tunnel -run 'TestRC9|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|TestRev4DelayedBodiesAndReaderRestartsKeepEveryTCPStream|TestRev4RetainedStateMixedTrafficAndNextTransfer|TestRev4LongBlackoutPreservesInflightTCPAndMessages'
      - name: Strict real low-capacity startup; zero lost probes or sockets
        working-directory: archives/1.0.0-rc10/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          GOMAXPROCS: "2"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "0"
          ITOM_STABILITY_QUALIFICATION: "1"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_PROFILE: "${{ matrix.profile }}"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "1"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/cold.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-cold64-${{ matrix.title }}
          path: ${{ runner.temp }}/cold.log
          retention-days: 30
