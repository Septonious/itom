name: RC2 vs RC10 identical healthy-server qualification
on:
  push:
    branches: ["codex/v1.0.0-rc10-development"]
    paths: [".github/workflows/itom-rc10-rc2-comparison.yml", "archives/1.0.0-rc10/experiments/prepare_baseline_comparison.py"]
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOWORK: off
  GOFLAGS: -mod=readonly
jobs:
  paired-load:
    name: Paired RC2/RC10 ${{ matrix.title }}
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {title: fresh-single, streams: 1, retained: "0", repeats: 2, rtt: 40, order: "rc2 rc10", profile: "", hard: "1", stability: "0"}
          - {title: retained-single, streams: 1, retained: "1", repeats: 2, rtt: 40, order: "rc10 rc2", profile: "", hard: "1", stability: "0"}
          - {title: fresh-four, streams: 4, retained: "0", repeats: 2, rtt: 40, order: "rc10 rc2", profile: "", hard: "1", stability: "0"}
          - {title: retained-four, streams: 4, retained: "1", repeats: 2, rtt: 40, order: "rc2 rc10", profile: "", hard: "1", stability: "0"}
          - {title: fresh-multi, streams: 32, retained: "0", repeats: 2, rtt: 40, order: "rc2 rc10", profile: "", hard: "1", stability: "0"}
          - {title: retained-multi, streams: 32, retained: "1", repeats: 2, rtt: 40, order: "rc10 rc2", profile: "", hard: "1", stability: "0"}
          - {title: client20, streams: 32, retained: "1", repeats: 1, rtt: 20, order: "rc2 rc10", profile: "", hard: "1", stability: "0"}
          - {title: client50, streams: 32, retained: "1", repeats: 1, rtt: 50, order: "rc10 rc2", profile: "", hard: "1", stability: "0"}
          - {title: client100, streams: 32, retained: "1", repeats: 1, rtt: 100, order: "rc2 rc10", profile: "", hard: "1", stability: "0"}
          - {title: startup-single, streams: 1, retained: "0", repeats: 1, rtt: 40, order: "rc10 rc2", profile: "", hard: "1", stability: "0"}
          - {title: start10, streams: 32, retained: "0", repeats: 1, rtt: 40, order: "rc2 rc10", profile: "10:10,20:10,50:10,150:30", hard: "0", stability: "1"}
          - {title: start20, streams: 32, retained: "0", repeats: 1, rtt: 40, order: "rc10 rc2", profile: "20:10,50:10,150:40", hard: "0", stability: "1"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Reconstruct original RC2 production; overlay identical test fixtures only
        run: |
          set -euo pipefail
          python3 archives/1.0.0-rc10/experiments/prepare_baseline_comparison.py "$RUNNER_TEMP/paired"
          python3 -c 'import os;from pathlib import Path;p=Path("/sys/fs/cgroup/cpu.max");print("paired_host cpus=",os.cpu_count(),"affinity=",len(os.sched_getaffinity(0)),"quota=",p.read_text().strip() if p.exists() else "unreported","scope=shared process, not eight-core emulation")' | tee "$RUNNER_TEMP/paired/host.txt"
          for variant in rc2 rc10; do
            (cd "$RUNNER_TEMP/paired/$variant" && go test -p 2 -c -o "$RUNNER_TEMP/paired/$variant.test" ./tunnel)
          done
      - name: Run both sides serially on this same runner; preserve every failure
        shell: bash
        env:
          ITOM_HEALTHY_SERVER: "1"
          ITOM_LOAD_COMMAND_DELAY_MS: "0"
          ITOM_LOAD_SERVER_RTT_MS: "20"
          ITOM_LOAD_SERVER_MBPS: "1000"
          ITOM_LOAD_CLIENT_RTT_MS: "${{ matrix.rtt }}"
          ITOM_LOAD_CLIENT_MBPS: "600"
          ITOM_LOAD_PROVIDER_SERVICE_MS: "2"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "${{ matrix.hard }}"
          ITOM_STABILITY_QUALIFICATION: "${{ matrix.stability }}"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_RETAINED_STATE: "${{ matrix.retained }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "${{ matrix.repeats }}"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_PROFILE: "${{ matrix.profile }}"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "${{ matrix.profile != '' && '1' || '0' }}"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
          ORDER: "${{ matrix.order }}"
        run: |
          set -euo pipefail
          failed=0
          for variant in $ORDER; do
            if (cd "$RUNNER_TEMP/paired/$variant/tunnel" && "$RUNNER_TEMP/paired/$variant.test" -test.count=1 -test.timeout=600s -test.run='^TestTransportReworkQualification$' -test.v) 2>&1 | tee "$RUNNER_TEMP/paired/$variant.log"; then
              echo "$variant PASS" >> "$RUNNER_TEMP/paired/status.txt"
            else
              result=$?
              echo "$variant FAIL exit=$result" >> "$RUNNER_TEMP/paired/status.txt"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-${{ matrix.title }}
          path: |
            ${{ runner.temp }}/paired/*.log
            ${{ runner.temp }}/paired/*.json
            ${{ runner.temp }}/paired/*.txt
          retention-days: 30
  paired-core:
    name: Paired endpoint calibration, recovery and protected-state checks
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Prepare shared fixtures and verify immutable production hashes
        run: python3 archives/1.0.0-rc10/experiments/prepare_baseline_comparison.py "$RUNNER_TEMP/paired"
      - name: Same calibration, recovery, accounting and race checks on both sides
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for variant in rc2 rc10; do
            if bash -euo pipefail -c '
              cd "$1"
              go vet ./...
              go test -p 2 -count=1 -timeout=120s ./tunnel -run "TestHealthyEndpoint|TestHealthyServerClient|TestScenarioMobileNetworkRegression|TestProviderAccess20Calibration" -v
              go test -p 2 -count=1 -timeout=240s ./journal ./wallet ./flow ./datapath ./mailbox
              go test -p 2 -count=1 -timeout=150s ./tunnel -run "TestRC2|TestLoadedEchoCannotRaiseIdleCarrierSelectionBaseline|TestLoadedOnlyCarriersUseUnloadedPoolEstimate|TestFieldBulkLeavesTwoReadableAccountsForInteractiveData|TestFieldHTTPSBurstAndCanceledSocketsKeepCarriers|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|TestRev4RetainedStateMixedTrafficAndNextTransfer" -v
              go test -race -p 2 -count=1 -timeout=180s ./journal ./wallet ./datapath ./tunnel -run "TestRC2|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|Test.*(Quota|Unknown|Reclaim|Recovery|Proof)"
            ' -- "$RUNNER_TEMP/paired/$variant" > "$RUNNER_TEMP/paired/$variant-core.log" 2>&1; then
              echo "$variant PASS" >> "$RUNNER_TEMP/paired/status.txt"
            else
              result=$?
              echo "$variant FAIL exit=$result" >> "$RUNNER_TEMP/paired/status.txt"
              failed=1
            fi
          done
          cat "$RUNNER_TEMP/paired/status.txt"
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-core
          path: |
            ${{ runner.temp }}/paired/*-core.log
            ${{ runner.temp }}/paired/*.json
            ${{ runner.temp }}/paired/*.txt
          retention-days: 30
