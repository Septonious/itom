name: RC10 healthy-server reference; unchanged strict gates before builds
on:
  push:
    branches: ["codex/v1.0.0-rc10-development"]
    paths: ["archives/1.0.0-rc10/source/**", ".github/workflows/itom-rc10-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: archives/1.0.0-rc10/source
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  core:
    name: Go source integrity, latency selection and account recovery
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Source ID and immutable APK package validation
        working-directory: ${{ env.SOURCE }}
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc10
          python3 -m unittest discover -s tools -p 'test_*.py' -q
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('source-info.json').read_text())
          b=Path('android/app/build.gradle.kts').read_text()
          assert d['android_application_id']=='org.itom.client'
          assert 'applicationId = "org.itom.client"' in b
          assert 'applicationIdSuffix' not in b
          assert 'versionCode = 10009; versionName = "1.0.0-rc10"' in b
          PY
      - name: gofmt go vet and focused field regressions
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=120s ./tunnel -run 'TestHealthyEndpoint|TestHealthyServerClient|TestScenarioMobileNetworkRegression|TestProviderAccess20Calibration' -v | tee "$RUNNER_TEMP/healthy-model.log"
          go test -p 2 -count=1 -timeout=240s ./journal ./wallet ./flow ./datapath ./mailbox
          go test -p 2 -count=1 -timeout=150s ./tunnel -run 'TestRC10|TestRC8|TestRC7Speedup|TestRC5BulkACK|TestRC5LatestStatus|TestRC2|TestLoadedEchoCannotRaiseIdleCarrierSelectionBaseline|TestLoadedOnlyCarriersUseUnloadedPoolEstimate|TestFieldBulkLeavesTwoReadableAccountsForInteractiveData|TestFieldHTTPSBurstAndCanceledSocketsKeepCarriers|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|TestRev4RetainedStateMixedTrafficAndNextTransfer' -v | tee "$RUNNER_TEMP/rc10-focused.log"
      - name: Race check proof accounting and cleanup cancellation
        working-directory: ${{ env.SOURCE }}/core
        run: go test -race -p 2 -count=1 -timeout=180s ./journal ./wallet ./datapath ./tunnel -run 'TestRC10|TestRC8|TestRC5BulkACK|TestRC5LatestStatus|TestRC2|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|Test.*(Quota|Unknown|Reclaim|Recovery|Proof)'
      - name: Save regression evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc10-focused-core-evidence
          path: ${{ runner.temp }}/rc10-focused.log
          retention-days: 14
  sustained:
    name: ${{ matrix.streams }} streams, retained=${{ matrix.retained }}, two 60s rounds
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        streams: [1, 4, 32]
        retained: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Preserve strict throughput, trailing windows, RTT, probes and sockets
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_RETAINED_STATE: "${{ matrix.retained }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "2"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_HEALTHY_SERVER: "1"
          ITOM_LOAD_COMMAND_DELAY_MS: "0"
          ITOM_LOAD_SERVER_RTT_MS: "20"
          ITOM_LOAD_SERVER_MBPS: "1000"
          ITOM_LOAD_CLIENT_RTT_MS: "40"
          ITOM_LOAD_CLIENT_MBPS: "600"
          ITOM_LOAD_PROVIDER_SERVICE_MS: "2"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          python3 -c 'import os;from pathlib import Path; p=Path("/sys/fs/cgroup/cpu.max");print("test_host cpu_count=",os.cpu_count(),"affinity=",len(os.sched_getaffinity(0)),"cpu_quota=",p.read_text().strip() if p.exists() else "unreported","scope=shared_client_server_provider; not dedicated eight-core server")'
          go test -p 2 -count=1 -timeout=600s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/rc10-cleanup-load.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-cleanup-${{ matrix.streams }}-streams-retained-${{ matrix.retained }}
          path: ${{ runner.temp }}/rc10-cleanup-load.log
          retention-days: 14
  startup-ramp:
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: single
            streams: "1"
            profile: ""
            early: "0"
            hard: "1"
            stability: "0"
          - title: start10
            streams: "32"
            profile: "10:10,20:10,50:10,150:30"
            early: "1"
            hard: "0"
            stability: "1"
          - title: start20
            streams: "32"
            profile: "20:10,50:10,150:40"
            early: "1"
            hard: "0"
            stability: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Startup under real low-capacity cap and single-stream 75/75 hard gate
        working-directory: archives/1.0.0-rc10/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "${{ matrix.hard }}"
          ITOM_STABILITY_QUALIFICATION: "${{ matrix.stability }}"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_PROFILE: "${{ matrix.profile }}"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "${{ matrix.early }}"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_HEALTHY_SERVER: "1"
          ITOM_LOAD_COMMAND_DELAY_MS: "0"
          ITOM_LOAD_SERVER_RTT_MS: "20"
          ITOM_LOAD_SERVER_MBPS: "1000"
          ITOM_LOAD_CLIENT_RTT_MS: "40"
          ITOM_LOAD_CLIENT_MBPS: "600"
          ITOM_LOAD_PROVIDER_SERVICE_MS: "2"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/rc10-${{ matrix.title }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-${{ matrix.title }}-evidence
          path: ${{ runner.temp }}/rc10-${{ matrix.title }}.log
          retention-days: 14

  client-paths:
    name: Healthy server, client RTT ${{ matrix.rtt }} ms
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rtt: [20, 50, 100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Client-path sensitivity, original strict full and tail gates
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        env:
          ITOM_HEALTHY_SERVER: "1"
          ITOM_LOAD_COMMAND_DELAY_MS: "0"
          ITOM_LOAD_SERVER_RTT_MS: "20"
          ITOM_LOAD_SERVER_MBPS: "1000"
          ITOM_LOAD_CLIENT_RTT_MS: "${{ matrix.rtt }}"
          ITOM_LOAD_CLIENT_MBPS: "600"
          ITOM_LOAD_PROVIDER_SERVICE_MS: "2"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_RETAINED_STATE: "1"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=600s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/rc10-client-${{ matrix.rtt }}ms.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-client-${{ matrix.rtt }}ms
          path: ${{ runner.temp }}/rc10-client-${{ matrix.rtt }}ms.log
          retention-days: 14

  linux:
    needs: [core, sustained, startup-ramp, client-paths, android]
    name: Build Linux amd64 and arm64
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Match revision, build both server architectures
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc10
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd core && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "../dist/ITOM-1.0.0-RC10-linux-$arch.bin" ./cmd/itom)
            strings "dist/ITOM-1.0.0-RC10-linux-$arch.bin" | grep -q 'itom-1-0-0-rc10'
            test "$(stat -c %s "dist/ITOM-1.0.0-RC10-linux-$arch.bin")" -gt 1000000
          done
          (cd dist && sha256sum ITOM-1.0.0-RC10-linux-*.bin > NATIVE_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rc10-testing-linux
          path: ${{ env.SOURCE }}/dist/ITOM-1.0.0-RC10-linux-*.bin
          if-no-files-found: error
          retention-days: 30
  android:
    needs: [core, sustained, startup-ramp, client-paths]
    name: Build Android APK, SDK tests, lint and JNI
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Pin SDK/JDK/NDK and build exact RC10 application
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py android --expect-revision itom-1-0-0-rc10 --accept-android-licenses
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          meta=json.loads(Path('android/app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert meta['applicationId']=='org.itom.client', meta
          assert any(x['versionCode']==10009 and x['versionName']=='1.0.0-rc10-debug' for x in meta['elements'])
          apk=Path('dist/ITOM-1.0.0-RC10-debug.apk')
          assert apk.stat().st_size > 1000000
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert b'itom-1-0-0-rc10' in z.read(f'lib/{abi}/libgojni.so')
          PY
          signer="$(find "$HOME/.cache/itom-build" -type f -path '*/build-tools/36.0.0/apksigner' -print -quit)"
          test -x "$signer"
          "$signer" verify --print-certs dist/ITOM-1.0.0-RC10-debug.apk > dist/SIGNER.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rc10-testing-android
          path: |
            ${{ env.SOURCE }}/dist/ITOM-1.0.0-RC10-debug.apk
            ${{ env.SOURCE }}/dist/SIGNER.txt
            ${{ env.SOURCE }}/dist/test-summary.json
            ${{ env.SOURCE }}/dist/lint-summary.json
          if-no-files-found: error
          retention-days: 30
  source:
    needs: [core, sustained, startup-ramp, client-paths]
    name: Package executable RC10 source
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Integrity check and source archive
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc10
          python3 tools/package_sources.py --output "$GITHUB_WORKSPACE/ITOM-1.0.0-RC10-sources.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rc10-testing-source
          path: ITOM-1.0.0-RC10-sources.zip
          if-no-files-found: error
          retention-days: 30
  package:
    name: Assemble verified files; testing only, no release tag
    needs: [linux, android, source]
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rc10-testing-linux
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: rc10-testing-android
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: rc10-testing-source
          path: package
      - name: Archive matched outputs and source SHA
        shell: bash
        run: |
          set -euo pipefail
          cd package
          test -s ITOM-1.0.0-RC10-debug.apk
          test -s ITOM-1.0.0-RC10-linux-amd64.bin
          test -s ITOM-1.0.0-RC10-linux-arm64.bin
          test -s ITOM-1.0.0-RC10-sources.zip
          printf '%s\n'             'ITOM 1.0.0 RC10 — LAB QUALIFICATION PASSED; FIELD VALIDATION REQUIRED'             'Build commit: ${{ github.sha }}'             'Update Android and server together. APK app ID org.itom.client.'             'Check installed APK signing certificate before in-place upgrade.'             'Do NOT reset accounts, IMAP quota journals, wallets or client identities.'             'Healthy-endpoint laboratory 75/75 Mbps tails and <=750ms RTT gates passed; real-provider and dedicated eight-core hardware performance are not certified.'             'See the parallel RC10 development CI for pass/fail results.' > TESTING_NOTES.txt
          sha256sum ITOM-1.0.0-RC10-* SIGNER.txt TESTING_NOTES.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          zip -q ../ITOM-1.0.0-RC10-testing-package.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-1.0.0-RC10-testing-package
          path: ITOM-1.0.0-RC10-testing-package.zip
          if-no-files-found: error
          retention-days: 30
