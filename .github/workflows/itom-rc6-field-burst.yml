name: RC6 field regression - 32 parallel TCP streams
on:
  push:
    branches: ["codex/rc6-field-stability"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-burst-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      SOURCE: archives/1.0.0-rc6/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc6/source/core/go.mod
          cache: false
      - name: Fast placement, TCP parity, delivery and journal invariants
        working-directory: ${{ env.SOURCE }}/core
        run: |
          go test -p 2 -count=1 -timeout=180s ./datapath ./flow ./journal ./tunnel -run 'TestFieldParallelStartupDoesNotConcentrateShortWrites|TestFastPlacementHistoryIsIdleSafeAndAdvisory|TestShortAffinityAcrossDifferentEndpointReserves|TestParallelShortBurstWaitsForResponsiveSlotInsteadOfSlowOutlier|TestTrafficClassFragmentedBurstAndAuthenticatedDrain|TestRev4LongBlackoutPreservesInflightTCPAndMessages'
      - name: 60s high fan-out, real TCP connections, startup and 150Mbps acceleration
        working-directory: ${{ env.SOURCE }}/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_STABILITY_QUALIFICATION: "1"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "150"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          # Keep the strict <750ms RTT gate, every-second duplex positive,
          # zero probe failures and identical live TCP socket identity.
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel | tee "$RUNNER_TEMP/rc6-field-burst.log"
      - name: Record evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-field-burst-qualification-evidence
          path: ${{ runner.temp }}/rc6-field-burst.log
          retention-days: 14
