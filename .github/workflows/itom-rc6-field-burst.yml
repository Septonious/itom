name: RC6 field regression - 32 parallel TCP streams
on:
  push:
    branches: ["codex/rc6-field-stability"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  field-burst-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      SOURCE: archives/1.0.0-rc6/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc6/source/core/go.mod
          cache: false
      - name: Short placement and full HTTPS cancellation burst regressions
        working-directory: ${{ env.SOURCE }}/core
        run: |
          go test -p 2 -count=1 -timeout=180s ./datapath ./flow ./journal ./tunnel -run 'TestFieldParallelStartup|TestFastPlacementHistory|TestShortAffinity|TestParallelShortBurst|TestTrafficClassFragmented|TestRev4LongBlackout|TestFieldHTTPSBurst'
      - name: 32-stream steady-state measurement, strict latency gate
        working-directory: ${{ env.SOURCE }}/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_STABILITY_QUALIFICATION: "1"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "150"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run TestTransportReworkQualification -v ./tunnel 2>&1 | tee "${RUNNER_TEMP}/rc6-field-burst.log"
      - name: Save constant-cap evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-field-burst-qualification-evidence
          path: ${{ runner.temp }}/rc6-field-burst.log
          retention-days: 14
      - name: Real cold low-link startup 10 to 20 to 50 to 150 Mbps
        if: always()
        working-directory: ${{ env.SOURCE }}/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_STABILITY_QUALIFICATION: "1"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "150"
          ITOM_LOAD_PROVIDER_PROFILE: "10:10,20:10,50:10,150:30"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "1"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run TestTransportReworkQualification -v ./tunnel 2>&1 | tee "${RUNNER_TEMP}/rc6-field-acceleration.log"
      - name: Save acceleration evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-field-acceleration-evidence
          path: ${{ runner.temp }}/rc6-field-acceleration.log
          retention-days: 14
      - name: Real 20 Mbps startup then accelerate to 50 and 150 Mbps
        if: always()
        working-directory: ${{ env.SOURCE }}/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_STABILITY_QUALIFICATION: "1"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "150"
          ITOM_LOAD_PROVIDER_PROFILE: "20:10,50:10,150:40"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "1"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run TestTransportReworkQualification -v ./tunnel 2>&1 | tee "${RUNNER_TEMP}/rc6-field-20to150.log"
      - name: Save 20 Mbps speedup evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-field-20to150-evidence
          path: ${{ runner.temp }}/rc6-field-20to150.log
          retention-days: 14
