name: Publish verified persistent-signed session-v2 RC1.13
on:
  push:
    branches: ["codex/v1.1.0-session-transport-v2"]
    paths: [".github/workflows/itom-session-v2-rc1-13-publish.yml"]
permissions: {contents: write, actions: read}
concurrency: {group: itom-session-v2-rc1-13-publication, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: 41189202095
      SOURCE_SHA: 29432b83e0673f4381a31a5c27a6d2e7e6cf1098
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source, complete functional checks and both builds
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" --no-tags
          git diff --exit-code "$SOURCE_SHA" HEAD -- archives/1.1.0/source
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/upstream.json"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'upstream.json').read_text());assert run['head_sha']==os.environ['SOURCE_SHA']
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          for name in ('safety','linux','android'):
              hits=[j for j in jobs if j['name']==name]
              assert len(hits)==1 and hits[0]['conclusion']=='success',name
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: session-v2-rc1-linux-*
          merge-multiple: true
          run-id: 41189202095
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: session-v2-rc1-android-evidence
          run-id: 41189202095
          github-token: ${{ github.token }}
          path: android-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: session-v2-rc1-apk-part*
          run-id: 41189202095
          github-token: ${{ github.token }}
          merge-multiple: true
          path: apk-parts
      - uses: actions/download-artifact@v4
        with:
          name: session-v2-rc1-signing-tools
          run-id: 41189202095
          github-token: ${{ github.token }}
          path: signing-tools
      - uses: actions/download-artifact@v4
        with:
          name: session-v2-rc1-safety
          run-id: 41189202095
          github-token: ${{ github.token }}
          path: evidence/hosted-safety
      - name: Reconstruct APK, apply public signature bytes, verify identities
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check NATIVE_SOURCE_SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path('release-assets');assert (r/'SOURCE_COMMIT').read_text().strip()==os.environ['SOURCE_SHA']
          manifest=json.loads(Path('android-evidence/manifest.json').read_text());assert manifest['source_commit']==os.environ['SOURCE_SHA']
          parts=[]
          for part in manifest['parts']:
              raw=Path('apk-parts',part['name']).read_bytes()
              assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256']
              parts.append(raw)
          apk=b''.join(parts)
          assert len(apk)==manifest['apk_bytes'] and hashlib.sha256(apk).hexdigest()==manifest['apk_sha256']
          Path('original.apk').write_bytes(apk)
          report=json.loads(Path('android-evidence/build-report.json').read_text())
          assert report['status']=='passed' and report['source_revision']=='itom-1-1-0-rc1-13'
          assert report['apk_identity']=={'application_id':'org.itom.client','version_code':10124,'version_name':'1.1.0-rc1.13-debug'}
          assert report['sha256']==manifest['apk_sha256']
          release=json.loads(Path('archives/1.1.0/publication/rc1-13/RC1_BUILD.json').read_text())
          assert release['source_commit']==os.environ['SOURCE_SHA']and not release['artifact_validation_pending']
          validation=release['artifact_validation']
          assert validation['exit_code']==0 and len(validation['tests'])==8 and all(t['Action']=='pass'for t in validation['tests'])

          for name in ('domain_tests','app_unit_tests'):
              assert report[name]['tests']>0 and report[name]['failures']==report[name]['errors']==report[name]['skipped']==0
          assert report['lint']['errors']==0
          for name,minimum in [('rc1-core.jsonl',320),('rc1-native.jsonl',14)]:
              events=[json.loads(s) for s in Path('evidence/hosted-safety',name).read_text().splitlines() if s.startswith('{')]
              assert not any(e.get('Action')=='fail' for e in events)
              assert sum(e.get('Action')=='pass' and e.get('Test')is not None and '/'not in e['Test'] for e in events)>=minimum
          PY
          python3 archives/1.1.0/publication/rc1-13/restore_rc1_signed_apk.py original.apk release-assets/ITOM-1.1.0-RC1.13.apk
          java -jar signing-tools/apksigner.jar verify --verbose --print-certs release-assets/ITOM-1.1.0-RC1.13.apk > release-assets/SIGNER.txt
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          signer=Path('release-assets/SIGNER.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: 47d0d87a99b31e32d7f8b9e5f199d3155c5626c324aa7a29f93c42db1d18e0a6' in signer
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in signer
          report=json.loads(Path('android-evidence/build-report.json').read_text())
          with zipfile.ZipFile('release-assets/ITOM-1.1.0-RC1.13.apk') as z:
              for name,expected in report['apk_native_libraries'].items():assert hashlib.sha256(z.read(name)).hexdigest()==expected
          PY
          cp android-evidence/build-report.json release-assets/ANDROID_BUILD.json
          cp archives/1.1.0/publication/rc1-13/RC1_BUILD.json archives/1.1.0/publication/rc1-13/RC1_SOURCE_MANIFEST.json release-assets/
          cp archives/1.1.0/publication/rc1-13/RC1.13-synthetic-evidence.zip release-assets/
          cp archives/1.1.0/RC1.13_TESTING.md archives/1.1.0/RC1.13_INVESTIGATION.md release-assets/
          (cd evidence && zip -q -r "$GITHUB_WORKSPACE/release-assets/RC1.13-hosted-safety.zip" .)
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          r=Path('release-assets')
          (r/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(r.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - name: Publish verified downloadable testing assets
        run: |
          set -euo pipefail
          tag=v1.1.0-rc1.13
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.0-rc1.13")' > "$RUNNER_TEMP/existing.json"
          if [ -s "$RUNNER_TEMP/existing.json" ]; then
            python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/existing.json"))["draft"], "Refusing to overwrite a published release"'
          else
            gh release create "$tag" --draft --prerelease --latest=false --target "$SOURCE_SHA" --title 'ITOM 1.1.0 RC1.13 — historical inventory isolation and startup diagnostics' --notes-file archives/1.1.0/RC1.13_TESTING.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.0-rc1.13")' > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          d=json.loads(Path(os.environ['RUNNER_TEMP'],'release.json').read_text())
          assert d['draft'] and d['prerelease']
          assets={a['name']:a for a in d['assets']}
          for p in Path('release-assets').iterdir():
              if p.is_file():
                  a=assets[p.name]
                  assert a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          PY
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,assets
