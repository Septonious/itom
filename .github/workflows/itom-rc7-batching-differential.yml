name: RC7 differential strict throughput/RTT benchmark
on:
  push:
    branches:
      - codex/rc7-rc6-control
      - codex/rc7-batch-residence32
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        streams: [4,32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc7/source/core/go.mod
          cache: false
      - name: Unmodified strict 75/75 RTT<=750ms full-capacity qualification
        working-directory: archives/1.0.0-rc7/source/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC7_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "150"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run TestTransportReworkQualification -v ./tunnel 2>&1 | tee "${RUNNER_TEMP}/rc7-diff.log"
      - name: Evidence, including all failed cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-diff-${{ matrix.streams }}-streams
          path: ${{ runner.temp }}/rc7-diff.log
          retention-days: 14
