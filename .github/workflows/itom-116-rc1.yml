name: ITOM 1.1.6 RC1 direct-release build (artifact quota safe)
on:
  push:
    branches: [codex/itom-1.1.6-low-latency]
    paths:
      - "archives/1.1.6/**"
      - ".github/workflows/itom-116-rc1.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: itom-116-rc1
  cancel-in-progress: true
env:
  SOURCE: archives/1.1.6/source
  GOTOOLCHAIN: local
  GOWORK: "off"
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Isolated native test cohort before expensive full suite
        working-directory: archives/1.1.6/source/native
        run: go test -mod=readonly -count=1 -timeout=120s -v ./...
      - name: Source integrity, normal/race tests and native contracts
        run: python3 "$SOURCE/tools/build.py" core --race --expect-revision itom-1-1-6-rc1
      - name: Expose failed source safety diagnostics without upload-artifact
        if: failure()
        shell: bash
        run: |
          echo "Core test stage:"
          cat "$SOURCE/dist/core-report.json" 2>/dev/null || true
          echo "Core build log:"
          tail -n 200 "$SOURCE/dist/core-build.log" 2>/dev/null || true
          echo "Core stderr:"
          tail -n 100 "$SOURCE/dist/core-test-stderr.log" 2>/dev/null || true
          echo "Race stderr:"
          tail -n 100 "$SOURCE/dist/core-race-stderr.log" 2>/dev/null || true
      - name: Focused low-latency regression tests
        working-directory: archives/1.1.6/source/mailstream
        run: |
          go test -p 2 -count=1 -timeout=120s -run '^TestRC116' -v .
          go vet ./...


  network-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Paired home IMAP 15-30ms, 500Mbps physical reference
        run: |
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out home-profile --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile home --client-mbps 500 --accounts 15 --duration 8s --streams 8 --idle-probes 10 --post-probes 10 --order baseline-first
      - name: Paired mobile IMAP 30-150ms, 160/90Mbps physical reference
        run: |
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out mobile-profile --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile mobile --client-mbps 160 --client-download-mbps 160 --client-upload-mbps 90 --accounts 15 --duration 8s --streams 8 --idle-probes 10 --post-probes 10 --order candidate-first
      - name: Require complete application transfers, preserve exact measured results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for profile in ('home-profile','mobile-profile'):
              manifest=json.loads(Path(profile,'manifest.json').read_text())
              assert manifest['rc116_latency_profile']==profile.split('-')[0]
              for name in ('rc2','candidate'):
                  p=Path(profile,name+'.json')
                  assert p.is_file(),p
                  result=json.loads(p.read_text())
                  assert result.get('success') and result.get('stage')=='complete',(profile,name,result.get('error'),result.get('stage'))
              print(profile,'reference and candidate completed; numerical RTT and throughput require paired evaluation')
          PY

  release:
    needs: [safety, network-profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ITOM_ANDROID_KEYSTORE_B64: ${{ secrets.ITOM_ANDROID_KEYSTORE_B64 }}
      ITOM_ANDROID_STORE_PASSWORD: ${{ secrets.ITOM_ANDROID_STORE_PASSWORD }}
      ITOM_ANDROID_KEY_ALIAS: ${{ secrets.ITOM_ANDROID_KEY_ALIAS }}
      ITOM_ANDROID_KEY_PASSWORD: ${{ secrets.ITOM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Load optional original signing certificate; do not create incompatible update
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          keys=('ITOM_ANDROID_KEYSTORE_B64','ITOM_ANDROID_STORE_PASSWORD','ITOM_ANDROID_KEY_ALIAS','ITOM_ANDROID_KEY_PASSWORD')
          present=[bool(os.environ.get(k)) for k in keys]
          if any(present) and not all(present):
              raise SystemExit('Incomplete private signing configuration')
          if all(present):
              target=Path(os.environ['RUNNER_TEMP'])/'itom-rc116-signing.jks'
              target.write_bytes(base64.b64decode(os.environ[keys[0]],validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as env:
                  env.write('ITOM_ANDROID_SIGNING_STORE_FILE='+str(target)+'\n')
              print('Existing signer loaded; verify certificate before release')
          else:
              print('No compatible signing key; Android output will remain UNSIGNED')
          PY
      - name: Build verified Linux amd64/arm64 binaries and executable source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SOURCE/tools/build.py" check --expect-revision itom-1-1-6-rc1
          mkdir -p release-assets
          for arch in amd64 arm64; do
            (cd "$SOURCE/core" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/release-assets/ITOM-1.1.6-RC1-linux-$arch.bin" ./cmd/itom)
          done
          release-assets/ITOM-1.1.6-RC1-linux-amd64.bin version | grep -Eq '^ITOM itom-1-1-6-rc1 linux amd64 manager '
          python3 "$SOURCE/tools/package_sources.py" --output "$GITHUB_WORKSPACE/release-assets/ITOM-1.1.6-RC1-sources.zip"
          (cd release-assets && sha256sum *.bin *.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Compile both JNI architectures, Android release, unit tests and fatal lint
        run: python3 "$SOURCE/tools/build.py" android --expect-revision itom-1-1-6-rc1 --accept-android-licenses
      - name: Verify APK identity, certificate, binaries and complete SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,zipfile,shutil,hashlib
          from pathlib import Path
          base=Path(os.environ['SOURCE'])
          report=json.loads((base/'dist/build-report.json').read_text())
          assert report['status']=='passed' and report['source_revision']=='itom-1-1-6-rc1'
          assert report['apk_identity']=={'application_id':'org.itom.client','version_code':10160,'version_name':'1.1.6-rc1'}
          assert report['android_variant']=='release'
          apk=base/'dist/ITOM-1.1.6-RC1.apk'
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert b'itom-1-1-6-rc1' in z.read('lib/'+abi+'/libgojni.so')
          signed=bool(os.environ.get('ITOM_ANDROID_SIGNING_STORE_FILE'))
          name='ITOM-1.1.6-RC1.apk' if signed else 'ITOM-1.1.6-RC1-UNSIGNED.apk'
          shutil.copy2(apk,Path('release-assets')/name)
          (Path('release-assets')/'SIGNING_STATUS.txt').write_text('Matching certificate verification pending\n' if signed else 'UNSIGNED: this APK cannot be installed or used to upgrade 1.1.5\n')
          shutil.copy2(base/'dist/build-report.json','release-assets/ANDROID_BUILD.json')
          (Path('release-assets')/'SOURCE_COMMIT').write_text(os.environ['GITHUB_SHA']+'\n')
          PY
          if [ -n "${ITOM_ANDROID_SIGNING_STORE_FILE:-}" ]; then
            signer="$(find "$HOME/.cache/itom-build" -name apksigner -type f -print -quit)"
            test -x "$signer"
            "$signer" verify --print-certs release-assets/ITOM-1.1.6-RC1.apk > release-assets/SIGNER.txt
            grep -Fq '0fdd51e00489c93b13ed5ce35e13257a9c8964f2f93b1660e5e542cfbf6fb4f0' release-assets/SIGNER.txt
            echo 'Signed with the exact 1.1.5 certificate' > release-assets/SIGNING_STATUS.txt
          fi
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('release-assets')
          signed=(root/'ITOM-1.1.6-RC1.apk').exists()
          info={'revision':'itom-1-1-6-rc1','source_commit':os.environ['GITHUB_SHA'],'release_type':'experimental_prerelease','field_qualified':False,'signing_compatible_with_115':signed,'files':{}}
          for p in root.iterdir():
              if p.is_file() and p.name!='RC_STATUS.json':
                  info['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/'RC_STATUS.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Publish verified RC1 prerelease assets directly (no Actions artifact quota)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.6-rc1 >/dev/null 2>&1; then
            echo 'Existing RC1 release: refusing overwrite or replacement' >&2
            exit 1
          fi
          gh release create v1.1.6-rc1 release-assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'ITOM 1.1.6 RC1 — low-latency field testing' --notes-file archives/1.1.6/RELEASE_NOTES.md
          gh release view v1.1.6-rc1 --json url,isPrerelease --jq '.'
