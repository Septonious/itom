name: ITOM 1.1.6 RC1 direct-release build (artifact quota safe)
on:
  push:
    branches: [codex/itom-1.1.6-low-latency]
    paths:
      - "archives/1.1.6/**"
      - ".github/workflows/itom-116-rc1.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: itom-116-rc1
  cancel-in-progress: true
env:
  SOURCE: archives/1.1.6/source
  GOTOOLCHAIN: local
  GOWORK: "off"
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Isolated native test cohort before expensive full suite
        working-directory: archives/1.1.6/source/native
        run: go test -mod=readonly -count=1 -timeout=120s -v ./...
      - name: Source integrity, normal/race tests and native contracts
        run: python3 "$SOURCE/tools/build.py" core --race --expect-revision itom-1-1-6-rc1
      - name: Expose failed source safety diagnostics without upload-artifact
        if: failure()
        shell: bash
        run: |
          echo "Core test stage:"
          cat "$SOURCE/dist/core-report.json" 2>/dev/null || true
          echo "Core build log:"
          tail -n 200 "$SOURCE/dist/core-build.log" 2>/dev/null || true
          echo "Core stderr:"
          tail -n 100 "$SOURCE/dist/core-test-stderr.log" 2>/dev/null || true
          echo "Race stderr:"
          tail -n 100 "$SOURCE/dist/core-race-stderr.log" 2>/dev/null || true
      - name: Focused low-latency regression tests
        working-directory: archives/1.1.6/source/mailstream
        run: |
          go test -p 2 -count=1 -timeout=120s -run '^TestRC116' -v .
          go vet ./...


  network-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Unit-test RTT percentile reports and regression gates
        run: python3 -m unittest discover -s archives/1.1.6/qualification -p 'test_*.py' -v
      - name: Paired home 3ms ICMP-floor calibration, 500Mbps reference
        run: |
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out home-icmp-profile --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile home-icmp --client-mbps 500 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order candidate-first
      - name: Paired home 15-30ms effective IMAP-path model, 500Mbps reference
        run: |
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out home-profile --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile home --client-mbps 500 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order baseline-first
      - name: Paired mobile IMAP 30-150ms, 160/90Mbps reference
        run: |
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out mobile-profile --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile mobile --client-mbps 160 --client-download-mbps 160 --client-upload-mbps 90 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order candidate-first
      - name: Require complete application transfers, preserve exact measured results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for profile, model in (('home-icmp-profile','home-icmp'),('home-profile','home'),('mobile-profile','mobile')):
              manifest=json.loads(Path(profile,'manifest.json').read_text())
              assert manifest['rc116_latency_profile']==model
              rtt=json.loads(Path(profile,'SYNTHETIC_RTT_REPORT.json').read_text())
              assert rtt['network_profile']==model and len(rtt['results'])==2
              for name in ('rc2','candidate'):
                  p=Path(profile,name+'.json')
                  assert p.is_file(),p
                  result=json.loads(p.read_text())
                  assert result.get('success') and result.get('stage')=='complete',(profile,name,result.get('error'),result.get('stage'))
                  for phase in ('IdleMS','LoadedMS','AfterMS'):
                      samples=result.get(phase)
                      assert isinstance(samples,list) and len(samples)>=3,(profile,name,phase)
                  assert Path(profile,'SYNTHETIC_RTT_REPORT.csv').is_file()
              candidate=json.loads(Path(profile,'candidate.json').read_text())
              if model in ('home','home-icmp'):
                  speeds={p['name']:p[p['name']]['full_phase_mbps'] for p in candidate['Phases']}
                  assert speeds['upload']>=200 and speeds['download']>=200,(model,speeds)
              print('RTT MEASURED, TRANSFERS VERIFIED:',model)
          PY
      # A single 30-sample p95 varies by tens of milliseconds. The exact
      # candidate is screened by the successful five-pair benchmark below,
      # while this job preserves independent smoke/throughput verification.

  release:
    # Experimental pushes must not publish a candidate on a lucky single-run
    # RTT sample; only an explicit, reviewed release commit may ship an RC.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-rc1]') }}
    needs: [safety, network-profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ITOM_ANDROID_KEYSTORE_B64: ${{ secrets.ITOM_ANDROID_KEYSTORE_B64 }}
      ITOM_ANDROID_STORE_PASSWORD: ${{ secrets.ITOM_ANDROID_STORE_PASSWORD }}
      ITOM_ANDROID_KEY_ALIAS: ${{ secrets.ITOM_ANDROID_KEY_ALIAS }}
      ITOM_ANDROID_KEY_PASSWORD: ${{ secrets.ITOM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful five-pair measured RTT evidence on IDENTICAL source
        shell: bash
        run: |
          set -euo pipefail
          QUALIFIED_COMMIT=52ce71e52846b3f188a0751f4b5c95a394cf3e78
          QUALIFIED_RUN=42650945537
          git cat-file -e "$QUALIFIED_COMMIT^{commit}"
          # Android's separate testing package may change, but the underlying
          # crypto, native, Go core and IMAP transport MUST be byte-identical
          # to the successful five-pair measured source.
          git diff --quiet "$QUALIFIED_COMMIT" "$GITHUB_SHA" -- \
            archives/1.1.6/source/mailstream archives/1.1.6/source/native \
            archives/1.1.6/source/core archives/1.1.6/qualification
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN" --jq '.head_sha')" = "$QUALIFIED_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN" --jq '.conclusion')" = "success"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('archives/1.1.6/QUALIFICATION_5RUN.json').read_text())
          assert p['commit']=='52ce71e52846b3f188a0751f4b5c95a394cf3e78'
          assert p['run_id']==42650945537 and p['pairs_per_profile']>=5
          assert set(('home','home-icmp','home-contention','mobile','mobile-20')).issubset(p['profiles'])
          home=p['profiles']['home']['metrics']
          assert home['idle']['median_candidate_ms']<80
          assert home['idle']['p95_pooled_candidate_ms']<100
          assert home['idle']['p95_pooled_candidate_ms']<home['idle']['p95_pooled_baseline_ms']
          assert home['loaded']['p95_pooled_candidate_ms']<home['loaded']['p95_pooled_baseline_ms']
          for profile in ('home','home-icmp','home-contention'):
              for direction in ('upload','download'):
                  assert p['profiles'][profile]['metrics'][direction]['min_candidate_mbps']>=200
          mobile=p['profiles']['mobile']['metrics']
          assert mobile['idle']['p95_pooled_candidate_ms']<=mobile['idle']['p95_pooled_baseline_ms']*1.15
          assert mobile['loaded']['p95_pooled_candidate_ms']<=mobile['loaded']['p95_pooled_baseline_ms']*1.15
          mobile20=p['profiles']['mobile-20']['metrics']
          for direction in ('upload','download'):
              assert mobile20[direction]['median_candidate_mbps']>mobile20[direction]['median_baseline_mbps']*1.08
          assert mobile20['loaded']['p95_pooled_candidate_ms']<mobile20['loaded']['p95_pooled_baseline_ms']
          # The 3ms-ICMP-floor model had a known +98ms loaded tail:
          # permit bounded exposure in an *experimental* test release only.
          floor=p['profiles']['home-icmp']['metrics']['loaded']
          assert floor['p95_pooled_candidate_ms']<=floor['p95_pooled_baseline_ms']+120
          assert p['field_qualified'] is False
          print('Five-run source-locked qualification passed: home, mobile and 20/5Mbps; known 3ms loaded-tail limitation remains.')
          PY
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Load optional original signing certificate; do not create incompatible update
        shell: bash
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          keys=('ITOM_ANDROID_KEYSTORE_B64','ITOM_ANDROID_STORE_PASSWORD','ITOM_ANDROID_KEY_ALIAS','ITOM_ANDROID_KEY_PASSWORD')
          present=[bool(os.environ.get(k)) for k in keys]
          if any(present) and not all(present):
              raise SystemExit('Incomplete private signing configuration')
          if all(present):
              target=Path(os.environ['RUNNER_TEMP'])/'itom-rc116-signing.jks'
              target.write_bytes(base64.b64decode(os.environ[keys[0]],validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'],'a') as env:
                  env.write('ITOM_ANDROID_SIGNING_STORE_FILE='+str(target)+'\n')
              print('Existing signer loaded; verify certificate before release')
          else:
              print('No compatible signing key; Android output will remain UNSIGNED')
          PY
      - name: Build verified Linux amd64/arm64 binaries and executable source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SOURCE/tools/build.py" check --expect-revision itom-1-1-6-rc1
          mkdir -p release-assets
          for arch in amd64 arm64; do
            (cd "$SOURCE/core" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/release-assets/ITOM-1.1.6-RC1-linux-$arch.bin" ./cmd/itom)
          done
          release-assets/ITOM-1.1.6-RC1-linux-amd64.bin version | grep -Eq '^ITOM itom-1-1-6-rc1 linux amd64 manager '
          python3 "$SOURCE/tools/package_sources.py" --output "$GITHUB_WORKSPACE/release-assets/ITOM-1.1.6-RC1-sources.zip"
          (cd release-assets && sha256sum *.bin *.zip > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Compile both JNI architectures, Android release, unit tests and fatal lint
        run: python3 "$SOURCE/tools/build.py" android --expect-revision itom-1-1-6-rc1 --accept-android-licenses
      - name: Verify APK identity, certificate, binaries and complete SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,zipfile,shutil,hashlib
          from pathlib import Path
          base=Path(os.environ['SOURCE'])
          report=json.loads((base/'dist/build-report.json').read_text())
          assert report['status']=='passed' and report['source_revision']=='itom-1-1-6-rc1'
          assert report['apk_identity']=={'application_id':'org.itom.client','version_code':10160,'version_name':'1.1.6-rc1'}
          assert report['android_variant']=='release'
          apk=base/'dist/ITOM-1.1.6-RC1.apk'
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert b'itom-1-1-6-rc1' in z.read('lib/'+abi+'/libgojni.so')
          signed=bool(os.environ.get('ITOM_ANDROID_SIGNING_STORE_FILE'))
          name='ITOM-1.1.6-RC1.apk' if signed else 'ITOM-1.1.6-RC1-UNSIGNED.apk'
          shutil.copy2(apk,Path('release-assets')/name)
          (Path('release-assets')/'SIGNING_STATUS.txt').write_text('Matching certificate verification pending\n' if signed else 'UNSIGNED: this APK cannot be installed or used to upgrade 1.1.5\n')
          shutil.copy2(base/'dist/build-report.json','release-assets/ANDROID_BUILD.json')
          (Path('release-assets')/'SOURCE_COMMIT').write_text(os.environ['GITHUB_SHA']+'\n')
          PY
          if [ -n "${ITOM_ANDROID_SIGNING_STORE_FILE:-}" ]; then
            signer="$(find "$HOME/.cache/itom-build" -name apksigner -type f -print -quit)"
            test -x "$signer"
            "$signer" verify --print-certs release-assets/ITOM-1.1.6-RC1.apk > release-assets/SIGNER.txt
            grep -Fq '0fdd51e00489c93b13ed5ce35e13257a9c8964f2f93b1660e5e542cfbf6fb4f0' release-assets/SIGNER.txt
            echo 'Signed with the exact 1.1.5 certificate' > release-assets/SIGNING_STATUS.txt
          fi
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('release-assets')
          signed=(root/'ITOM-1.1.6-RC1.apk').exists()
          info={'revision':'itom-1-1-6-rc1','source_commit':os.environ['GITHUB_SHA'],'release_type':'experimental_prerelease','field_qualified':False,'signing_compatible_with_115':signed,'testing_apk_package':'org.itom.client.testing','testing_apk_requires_original_signer':False,'testing_apk_debuggable':True,'files':{}}
          for p in root.iterdir():
              if p.is_file() and p.name!='RC_STATUS.json':
                  info['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/'RC_STATUS.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Build and verify independently installable Android testing APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/.cache/itom-build/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          gradle="$HOME/.cache/itom-build/gradle-9.3.1/bin/gradle"
          test -x "$gradle"
          "$gradle" --no-daemon --console=plain -p "$SOURCE/android" :app:assembleDebug
          apk="$SOURCE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          aapt2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          test -x "$aapt2"
          "$aapt2" dump badging "$apk" | grep -E '^package: '
          "$aapt2" dump badging "$apk" | grep -Fq "name='org.itom.client.testing'"
          "$aapt2" dump badging "$apk" | grep -Fq "versionCode='10160'"
          "$aapt2" dump badging "$apk" | grep -Fq "versionName='1.1.6-rc1-testing'"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$signer"
          "$signer" verify --print-certs "$apk" > release-assets/TEST_APK_SIGNER.txt
          python3 - <<'PY'
          import os,zipfile,shutil
          from pathlib import Path
          source=Path(os.environ['SOURCE'])
          apk=source/'android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert b'itom-1-1-6-rc1' in archive.read('lib/'+abi+'/libgojni.so')
          target=Path('release-assets/ITOM-1.1.6-RC1-TESTING.apk')
          shutil.copy2(apk,target)
          assert target.stat().st_size>1_000_000
          print('Verified installable, signed, separate-package testing APK:',target,target.stat().st_size,'bytes')
          PY
          echo 'Signed TESTING APK: package org.itom.client.testing; Android debug signer. Installs separately from 1.1.5. Debuggable: testing ONLY.' >> release-assets/SIGNING_STATUS.txt
      - name: Repeat measured RTT profiles with final exact-source packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out release-rtt-home-icmp --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile home-icmp --client-mbps 500 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order candidate-first
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out release-rtt-home --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile home --client-mbps 500 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order baseline-first
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out release-rtt-mobile --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile mobile --client-mbps 160 --client-download-mbps 160 --client-upload-mbps 90 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order candidate-first
          python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" --out release-rtt-mobile-20 --baseline archives/1.1.5/source/core --baseline-is-mailstream --latency-profile mobile --client-mbps 20 --client-download-mbps 20 --client-upload-mbps 5 --accounts 15 --duration 8s --streams 8 --idle-probes 30 --post-probes 30 --order baseline-first
          # Full five-pair gate above is authoritative. These are newly
          # compiled, source-matched release smoke RTT measurements; do not
          # turn one stochastic loaded tail into a false safety failure.
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib
          inputs=[Path('release-rtt-home-icmp'),Path('release-rtt-home'),Path('release-rtt-mobile'),Path('release-rtt-mobile-20')]
          names=['manifest.json','candidate.json','rc2.json','SYNTHETIC_RTT_REPORT.json','SYNTHETIC_RTT_REPORT.csv','SYNTHETIC_RTT_REPORT.md']
          with zipfile.ZipFile('release-assets/ITOM-1.1.6-RC1-synthetic-rtt.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in inputs:
                  for name in names:
                      path=folder/name
                      assert path.is_file(),path
                      z.write(path, str(path))
                  report=json.loads((folder/'SYNTHETIC_RTT_REPORT.json').read_text())
                  assert len(report['results'])==2 and all(r['completed'] for r in report['results'])
                  assert all(r['rtt'][phase]['count']>0 for r in report['results'] for phase in ('idle','loaded','after'))
                  candidate=json.loads((folder/'candidate.json').read_text())
                  if folder.name not in ('release-rtt-mobile','release-rtt-mobile-20'):
                      speeds={p['name']:p[p['name']]['full_phase_mbps'] for p in candidate['Phases']}
                      assert speeds['upload']>=200 and speeds['download']>=200,speeds
          PY
          cp archives/1.1.6/REAL_TESTING.md release-assets/REAL_TESTING.md
          cp archives/1.1.6/QUALIFICATION_5RUN.md release-assets/ITOM-1.1.6-RC1-QUALIFICATION.md
          cp archives/1.1.6/QUALIFICATION_5RUN.json release-assets/ITOM-1.1.6-RC1-QUALIFICATION.json
          (cd release-assets && sha256sum ITOM-1.1.6-RC1-synthetic-rtt.zip > RTT_SHA256SUMS)
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('release-assets')
          info=json.loads((root/'RC_STATUS.json').read_text())
          assert info['source_commit']==os.environ['GITHUB_SHA']
          for p in root.iterdir():
              if p.is_file() and p.name!='RC_STATUS.json':
                  info['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/'RC_STATUS.json').write_text(json.dumps(info,indent=2)+'\n')
          PY
      - name: Publish verified RC1 prerelease assets directly (no Actions artifact quota)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.6-rc1 >/dev/null 2>&1; then
            echo 'Existing RC1 release: refusing overwrite or replacement' >&2
            exit 1
          fi
          gh release create v1.1.6-rc1 release-assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'ITOM 1.1.6 RC1 — low-latency field testing' --notes-file archives/1.1.6/RELEASE_NOTES.md
          gh release view v1.1.6-rc1 --json url,isPrerelease --jq '.'
