name: RC8 development verification - no release promotion
on:
  push:
    branches: ["codex/v1.0.0-rc8-development"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: archives/1.0.0-rc8/source
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  core:
    name: Go source integrity, latency selection and account recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc8/source/core/go.mod
          cache: false
      - name: Source ID and immutable APK package validation
        working-directory: ${{ env.SOURCE }}
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc8
          python3 -m unittest discover -s tools -p 'test_*.py' -q
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('source-info.json').read_text())
          b=Path('android/app/build.gradle.kts').read_text()
          assert d['android_application_id']=='org.itom.client'
          assert 'applicationId = "org.itom.client"' in b
          assert 'applicationIdSuffix' not in b
          assert 'versionCode = 10007; versionName = "1.0.0-rc8"' in b
          PY
      - name: gofmt go vet and focused field regressions
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=150s ./tunnel -run 'TestRC8|TestRC7|TestLoadedEchoCannotRaiseIdleCarrierSelectionBaseline|TestLoadedOnlyCarriersUseUnloadedPoolEstimate|TestFieldBulkLeavesTwoReadableAccountsForInteractiveData|TestFieldHTTPSBurstAndCanceledSocketsKeepCarriers|TestRev4LongBlackoutPreservesInflightTCPAndMessages' -v | tee "$RUNNER_TEMP/rc8-focused.log"
      - name: Save regression evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-focused-core-evidence
          path: ${{ runner.temp }}/rc8-focused.log
          retention-days: 14
  android:
    name: Android SDK37, 82+ tests, lint and two JNI ABIs
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build RC8 development APK, tests and lint
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py android --expect-revision itom-1-0-0-rc8 --accept-android-licenses
      - name: Validate actual APK ID, both native revision strings and signer
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,zipfile
          d=json.loads(Path('android/app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert d['applicationId']=='org.itom.client',d
          assert any(x['versionCode']==10007 and x['versionName']=='1.0.0-rc8-debug' for x in d['elements']),d
          p=Path('dist/ITOM-1.0.0-RC8-debug.apk')
          assert p.stat().st_size>1000000
          with zipfile.ZipFile(p) as z:
            for abi in ('arm64-v8a','armeabi-v7a'):
              assert b'itom-1-0-0-rc8' in z.read(f'lib/{abi}/libgojni.so')
          print('RC8 APK package identity verified: org.itom.client')
          PY
          signer="$(find "$HOME/.cache/itom-build" -type f -path '*/build-tools/36.0.0/apksigner' -print -quit)"
          test -x "$signer"
          "$signer" verify --print-certs dist/ITOM-1.0.0-RC8-debug.apk > dist/SIGNER.txt
          (cd dist && sha256sum ITOM-1.0.0-RC8-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8-unqualified-android-logs-and-binary
          path: |
            ${{ env.SOURCE }}/dist/ITOM-1.0.0-RC8-debug.apk
            ${{ env.SOURCE }}/dist/SIGNER.txt
            ${{ env.SOURCE }}/dist/SHA256SUMS
            ${{ env.SOURCE }}/dist/build-report.json
            ${{ env.SOURCE }}/dist/lint-summary.json
            ${{ env.SOURCE }}/dist/test-summary.json
          retention-days: 14
  throughput:
    name: Baseline comparison ${{ matrix.streams }} streams (strict release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        streams: [4,32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc8/source/core/go.mod
          cache: false
      - name: Check 75/75 Mbps, RTT <=750ms, 60s and trailing windows
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/rc8-load.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8-strict-${{ matrix.streams }}-streams-evidence
          path: ${{ runner.temp }}/rc8-load.log
          retention-days: 14
