name: RC10 dynamic cleanup service comparison; unchanged gates
on:
  push:
    branches: ["codex/v1.0.0-rc10-development"]
    paths: [".github/workflows/itom-rc10-adaptive-cleanup.yml", "archives/1.0.0-rc10/experiments/adaptive_cleanup.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed4, fixed8, adaptive160, adaptive240]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Apply exactly one cleanup variant; RC2 transport policy unchanged
        run: python3 archives/1.0.0-rc10/experiments/adaptive_cleanup.py ${{ matrix.variant }}
      - name: Proof, propagation, empty-sample and cancellation regressions
        working-directory: archives/1.0.0-rc10/source/core
        env:
          GOMAXPROCS: "2"
        run: go test -p 2 -count=1 -timeout=120s ./tunnel -run 'TestRC10|TestRC8|TestRC2|Test.*(Cleanup|Reclaim|Proof)'
      - name: Strict retained32 download tail and application RTT
        working-directory: archives/1.0.0-rc10/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          GOMAXPROCS: "2"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_RETAINED_STATE: "1"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/adaptive.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-cleanup-${{ matrix.variant }}
          path: ${{ runner.temp }}/adaptive.log
          retention-days: 30
