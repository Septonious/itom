name: RC7 cold-start flight A/B 128KiB 256KiB (strict)
on:
  push:
    branches: ["codex/rc7-seed128", "codex/rc7-seed256"]
    paths: [".github/workflows/itom-rc7-seed-comparison.yml"]
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: full4
            streams: "4"
            profile: ""
            early: "0"
            release: "1"
            stability: "0"
          - case: full32
            streams: "32"
            profile: ""
            early: "0"
            release: "1"
            stability: "0"
          - case: speedup10
            streams: "32"
            profile: "10:10,20:10,50:10,150:30"
            early: "1"
            release: "0"
            stability: "1"
          - case: speedup20
            streams: "32"
            profile: "20:10,50:10,150:40"
            early: "1"
            release: "0"
            stability: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc7/source/core/go.mod
          cache: false
      - name: Controller/journal/receipt safety and package identity
        working-directory: archives/1.0.0-rc7/source/core
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=120s -run 'TestRC7AsymmetricWindow|TestRC7Directional|TestRC7SpeedupReallyStarts|TestShortAffinity|TestTrafficClassFragmented|TestRev2FastControl' ./tunnel
      - name: Test actual 60s duplex and 30 probes, no speed gate waiver at full capacity
        working-directory: archives/1.0.0-rc7/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC7_RELEASE_GATE: "${{ matrix.release }}"
          ITOM_STABILITY_QUALIFICATION: "${{ matrix.stability }}"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_PROFILE: "${{ matrix.profile }}"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "${{ matrix.early }}"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=320s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/seed-${{ matrix.case }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-${{ matrix.case }}-raw-evidence
          path: ${{ runner.temp }}/seed-${{ matrix.case }}.log
          retention-days: 14
