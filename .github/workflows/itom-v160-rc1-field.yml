name: ITOM 1.6.0 RC1 field diagnostic (UNQUALIFIED)
on:
  push:
    branches: [field/itom-v160-rc1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.0-rc20
          path: rc20-reference
          sparse-checkout: testing/rc20/downloads
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify exact field source
        run: test "$(git rev-parse HEAD:src)" = "0b4696f49aa8ccfae67e10d4177b8f1fc324785e"
      - name: Serial static analysis
        run: |
          for module in mailstream core native qualification; do
            (cd "src/$module" && go vet -mod=readonly ./...)
          done
      - name: Compact foundations and integrated transport regressions
        working-directory: src/mailstream
        run: |
          go test -race -mod=readonly -count=3 -timeout=3m ./v160
          go test -race -mod=readonly -count=2 -timeout=8m -run '^(TestV160|TestBatchedReceiptRetirement|TestRC1AbsoluteControlReservationCeiling|TestControlMessageReservations|TestControlCountRecovered|TestAllStorageProofs|TestBulkControlUrgency|TestFeedbackBurstsRotate|TestRC116FeedbackCoalescing|TestFreshHTTPSWhileBulkWindowShrinks|TestRadioJitterWithPacingRetainsLearnedBulkPath)' .
          go test -race -mod=readonly -count=1 -timeout=5m -run '^TestSixtyFourTLSStreamsReturnSharedCredit$' .
          go test -mod=readonly -count=1 -timeout=5m -run '^TestRepeatedHTTPSExceedsPhysicalBudgetWithPortableCollection$' .
      - name: Mailbox, relay, controller and tunnel integration
        working-directory: src/core
        run: go test -race -mod=readonly -count=1 -timeout=8m ./...
      - name: Extract verified routing data
        run: python3 src/qualification/rc20_routing_data.py rc20-reference/testing/rc20/downloads/itom-1.5.0-rc20.apk rc20-reference/testing/rc20/downloads/SHA256SUMS "$RUNNER_TEMP/rc20-data"
      - name: Native tests with routing assets
        working-directory: src/native
        run: ITOM_RC20_DATA_DIR="$RUNNER_TEMP/rc20-data" go test -race -mod=readonly -count=1 -timeout=8m ./...
      - name: Qualification regressions
        working-directory: src/qualification
        run: |
          go test -race -mod=readonly -count=1 -timeout=5m ./...
          python3 -m unittest test_home_gate test_mobile_gate
  field-performance:
    needs: native-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify exact diagnostic source
        run: test "$(git rev-parse HEAD:src)" = "0b4696f49aa8ccfae67e10d4177b8f1fc324785e"
      - name: Strict direct and encrypted home screens and cellular anti-collapse
        working-directory: src/qualification
        run: |
          failed=0
          python3 run_home.py "$RUNNER_TEMP/rc1-home-direct" --screen || failed=1
          python3 run_home.py "$RUNNER_TEMP/rc1-home-encrypted" --screen --encrypted-exit || failed=1
          python3 run_cellular.py "$RUNNER_TEMP/rc1-cellular" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ITOM-1.6.0-RC1-performance-evidence
          path: |
            ${{ runner.temp }}/rc1-home-direct/
            ${{ runner.temp }}/rc1-home-encrypted/
            ${{ runner.temp }}/rc1-cellular/
          if-no-files-found: warn
  build:
    needs: native-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.0-rc20
          path: rc20-reference
          sparse-checkout: testing/rc20/downloads
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact field source
        run: test "$(git rev-parse HEAD:src)" = "0b4696f49aa8ccfae67e10d4177b8f1fc324785e"
      - name: Verify and bundle actual RC20 routing data
        run: python3 src/qualification/rc20_routing_data.py rc20-reference/testing/rc20/downloads/itom-1.5.0-rc20.apk rc20-reference/testing/rc20/downloads/SHA256SUMS src/android/app/src/main/assets/routing-data
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure pinned Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          "$manager" --sdk_root="$sdk" --channel=3 'platforms;android-29' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Compile matching ARM64 native AAR
        working-directory: src/native
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p "$(go env GOPATH)/pkg/gomobile" ../android/app/libs
          gomobile bind -trimpath -target=android/arm64 -androidapi=29 -javapkg=org.itom.nativecore -o ../android/app/libs/itom.aar .
      - name: Build development APK and release variant
        working-directory: src/android
        run: gradle --no-daemon :domain:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
      - name: Build matching Linux AMD64 server and exit binary
        working-directory: src/core
        run: |
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o ../../dist/itom-linux-amd64 ./cmd/itom
      - name: Stage diagnostic artifacts and provenance
        run: |
          cp src/android/app/build/outputs/apk/debug/app-debug.apk dist/itom-1.6.0-rc1-dev-testing.apk
          cp src/android/app/build/outputs/apk/release/app-release-unsigned.apk dist/itom-1.6.0-rc1-dev-release-UNSIGNED.apk
          printf 'UNQUALIFIED: partial transport rework; old IMAP carrier remains active. Use matching client, ingress, and exit. Clean test mailboxes only. Do not connect multiple devices under one identity.\n' > dist/FIELD-ONLY.txt
          git rev-parse HEAD > dist/SOURCE-COMMIT
          git rev-parse HEAD:src > dist/SOURCE-TREE
          cd dist
          sha256sum itom-linux-amd64 *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-1.6.0-RC1-FIELD-TEST-UNQUALIFIED
          path: dist/
          if-no-files-found: error
