name: ITOM RTT A/B versus released 1.1.6 RC1
on:
  push:
    branches: [codex/itom-1.1.6-low-latency, codex/itom-1.1.7-rc2-zero-rtt]
    paths:
      - "archives/1.1.6/source/mailstream/**"
      - "archives/1.1.6/qualification/**"
      - ".github/workflows/itom-rtt-vs-release.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itom-117-rtt-ab
  cancel-in-progress: true
jobs:
  ab:
    name: "Released RC1 vs new RTT path — ${{ matrix.profile }}"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: home
            rate: '500'
            streams: '8'
            extra: ''
          - profile: home-icmp
            rate: '500'
            streams: '8'
            extra: ''
          - profile: mobile
            rate: '160'
            streams: '8'
            extra: '--client-upload-mbps 90 --client-download-mbps 160'
          - profile: mobile-20
            rate: '20'
            streams: '4'
            extra: '--client-upload-mbps 5 --client-download-mbps 20'
          - profile: mobile-8
            rate: '8'
            streams: '2'
            extra: '--client-upload-mbps 2 --client-download-mbps 8'
          - profile: mobile-2
            rate: '2'
            streams: '1'
            extra: '--client-upload-kbps 500 --client-download-kbps 2000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Unit-test strict RTT and goodput rejection gate
        run: python3 -m unittest discover -s archives/1.1.6/qualification -p 'test_gate_rc117_zero_rtt.py' -v
      - name: Check full source and focused responsive feedback tests
        working-directory: archives/1.1.6/source/mailstream
        run: go test -count=1 -timeout=120s -run '^TestRC11[67]' -v .
      - name: Materialize immutable RELEASED baseline without changing current sources
        shell: bash
        run: |
          set -euo pipefail
          baseline=a134e4a05f8aa7cb83cf455129bd633c5c90c96e
          git cat-file -e "$baseline^{commit}"
          git worktree add --detach "$RUNNER_TEMP/itom-rc116-release" "$baseline"
          # RC2 changes code version identifiers: build both trees independently.
          # Keep the released RC1 SHA pinned for immutable A/B evidence.
          test -f "$RUNNER_TEMP/itom-rc116-release/archives/1.1.6/source/mailstream/session.go"
          echo "Immutable release baseline: $baseline"
      - name: Compare five paired TLS/IMAP RTT distributions, both directions
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          RATE: ${{ matrix.rate }}
          EXTRA: ${{ matrix.extra }}
          STREAMS: ${{ matrix.streams }}
        run: |
          set -euo pipefail
          fixture="$PROFILE"
          if [[ "$fixture" == mobile-20 || "$fixture" == mobile-8 ]]; then fixture=mobile; fi
          if [[ "$fixture" == mobile-2 ]]; then fixture=mobile-poor; fi
          for attempt in 1 2 3 4 5; do
            order=baseline-first
            if [[ $attempt == 2 || $attempt == 4 ]]; then order=candidate-first; fi
            python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" \
              --out "rc117-$PROFILE-$attempt" \
              --baseline "$RUNNER_TEMP/itom-rc116-release/archives/1.1.6/source/core" \
              --baseline-is-mailstream --baseline-version 1.1.6-rc1 \
              --candidate-version 1.1.7-rc2 --latency-profile "$fixture" \
              --client-mbps "$RATE" $EXTRA --accounts 15 --duration 12s \
              --streams "$STREAMS" --idle-probes 40 --post-probes 40 --order "$order"
          done
      - name: Print all measured RTT samples, medians, tails and verified throughput
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 archives/1.1.6/qualification/aggregate_rtt.py \
            "rc117-$PROFILE-1" "rc117-$PROFILE-2" "rc117-$PROFILE-3" \
            "rc117-$PROFILE-4" "rc117-$PROFILE-5" \
            --out "rc117-$PROFILE-aggregate.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,statistics
          profile=os.environ['PROFILE']
          all_pairs=[]
          for run in range(1,6):
              r=json.loads(Path(f'rc117-{profile}-{run}/SYNTHETIC_RTT_REPORT.json').read_text())
              old,new=r['results']
              assert old['completed'] and new['completed']
              all_pairs.append((old,new))
          print('ACTUAL MEASURED SYNTHETIC TLS APPLICATION RTT:',profile)
          for phase in ('idle','loaded','after'):
              for key in ('median_ms','p95_ms'):
                  old=[x[0]['rtt'][phase][key] for x in all_pairs]
                  new=[x[1]['rtt'][phase][key] for x in all_pairs]
                  print(phase,key,old,'->',new,'median',statistics.median(old),'->',statistics.median(new))
          for d in ('upload','download'):
              old=[x[0]['throughput_mbps'][d] for x in all_pairs]
              new=[x[1]['throughput_mbps'][d] for x in all_pairs]
              print(d,'Mbps RC1 -> RC2',old,'->',new)
              if profile.startswith('home'):
                  assert min(new)>200,(d,new)
          PY
      - name: Enforce strict measured zero RTT regression and 75% throughput floors
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 archives/1.1.6/qualification/gate_rc117_zero_rtt.py \
            --profile "$PROFILE" \
            "rc117-$PROFILE-1" "rc117-$PROFILE-2" "rc117-$PROFILE-3" \
            "rc117-$PROFILE-4" "rc117-$PROFILE-5"
