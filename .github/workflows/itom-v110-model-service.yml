name: ITOM 1.1 provider-service sensitivity
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-model-service.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOWORK: off
  ITOM_MODEL_REVISION: "2"
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Isolated controller and immutable reference
        run: |
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/delivery-model/prepare.py "$RUNNER_TEMP/paired"
      - name: Model traces, logical reservations and physical authority
        working-directory: ${{ runner.temp }}/paired/model
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=180s ./journal ./wallet ./pool ./flow ./datapath
          go test -p 2 -count=1 -timeout=240s ./tunnel -run 'TestThroughputModel|TestDeliveryFlightEarlyPartialACKUnknownAndStop|TestDeliveryFullBulkLeavesFastReserveAndCancellation|TestDeliveryAbortedBeforePublicationReturnsOnlyItsLogicalFlight|TestDeliveryStoppedQueuedBatchDoesNotFailSiblingOwners|TestDeliveryFutureBatchCannotPinWorkerAheadOfMissingPredecessor|TestRemote|Test.*Grant|Test.*Release|TestRev7CappedMixedSocketsRepairWithoutLosingOriginalStream|TestRev5Retained' -v
          go test -race -p 2 -count=1 -timeout=180s ./tunnel -run 'TestThroughputModel|TestDeliveryFlightEarlyPartialACKUnknownAndStop|TestDeliveryFullBulkLeavesFastReserveAndCancellation|TestDeliveryAbortedBeforePublicationReturnsOnlyItsLogicalFlight' -v
          go test -p 2 -tags itomtest -count=1 -timeout=120s ./tunnel -run '^TestV110WorstRaw4GConnectivity$' -v
  throughput:
    name: Model versus controls ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: service20, streams: 4, retained: 0, trace: 0, service: 20}
          - {name: service80, streams: 4, retained: 0, trace: 0, service: 80}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Three variants, identical fixtures, no compilation during measurements
        run: |
          set -euo pipefail
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/delivery-model/prepare.py "$RUNNER_TEMP/paired"
          python3 -c 'import os,pathlib; p=pathlib.Path("/sys/fs/cgroup/cpu.max"); print("cpus",os.cpu_count(),"quota",p.read_text() if p.exists() else "unreported")' > "$RUNNER_TEMP/paired/host.txt"
          for variant in rc2 model; do
            (cd "$RUNNER_TEMP/paired/$variant" && go test -p 2 -tags itomtest -c -o "$RUNNER_TEMP/paired/$variant.test" ./tunnel)
          done
      - name: Complete rounds; unchanged historical gates, including failures
        env:
          ITOM_HEALTHY_SERVER: "1"
          ITOM_LOAD_COMMAND_DELAY_MS: "0"
          ITOM_LOAD_SERVER_RTT_MS: "2"
          ITOM_LOAD_SERVER_MBPS: "1000"
          ITOM_LOAD_CLIENT_RTT_MS: "40"
          ITOM_LOAD_CLIENT_MBPS: "500"
          ITOM_LOAD_PROVIDER_MBPS: "500"
          ITOM_LOAD_PROVIDER_SERVICE_MS: "${{ matrix.service }}"
          ITOM_LOAD_LITERAL_PLUS: "0"
          ITOM_LOAD_BINARY_FETCH: "0"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_RETAINED_STATE: "${{ matrix.retained }}"
          ITOM_MODEL_MOBILE_TRACE: "${{ matrix.trace }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "2"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_LOAD_MIN_MBPS: "100"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -uo pipefail
          failed=0
          for trial in 1 2; do
            order='rc2 model'; if [ "$trial" = 2 ]; then order='model rc2'; fi
            for variant in $order; do
              if "$RUNNER_TEMP/paired/$variant.test" -test.run '^TestTransportReworkQualification$' -test.v -test.timeout 600s > "$RUNNER_TEMP/paired/$trial-$variant.log" 2>&1; then
                echo "$trial $variant PASS"
              else
                echo "$trial $variant FAIL"; failed=1
              fi
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-model-service-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/paired/*.log
            ${{ runner.temp }}/paired/provenance.json
            ${{ runner.temp }}/paired/host.txt
          retention-days: 90
