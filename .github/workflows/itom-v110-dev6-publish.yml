name: Publish exact signed DEV6 testing packages
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-dev6-publish.yml"]
permissions: {contents: write, actions: read}
concurrency:
  group: publish-itom-v110-dev6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v110-dev6-model-android
          run-id: 39886424651
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-apk
      - uses: actions/download-artifact@v4
        with:
          name: v110-dev6-model-linux
          run-id: 39886424651
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@v4
        with:
          name: v110-dev6-public-signing-tools
          run-id: 39886424651
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tools
      - uses: actions/download-artifact@v4
        with:
          pattern: dev6-*
          run-id: 39882769996
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lab-results/main
      - uses: actions/download-artifact@v4
        with:
          pattern: dev6-previous-*
          run-id: 39882813844
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lab-results/previous
      - uses: actions/download-artifact@v4
        with:
          name: dev6-isolated-race-evidence
          run-id: 39885675385
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lab-results/isolated-races
      - uses: actions/download-artifact@v4
        with:
          name: dev6-experimental-race-report
          run-id: 39886424651
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lab-results/experimental-classification
      - name: Restore exact signed APK and verify all package identities
        env:
          PACKAGE_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir release-assets
          python3 archives/1.1.0/publication/restore_dev6_signed_apk.py \
            "$PACKAGE_ROOT/original-apk/ITOM-1.1.0-DEV6-debug.apk" \
            release-assets/ITOM-1.1.0-DEV6.apk
          cp "$PACKAGE_ROOT"/linux/ITOM-1.1.0-DEV6-linux-*.bin release-assets/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          metadata=json.loads(Path('archives/1.1.0/DEV6_BUILD.json').read_text())
          assert metadata['runtime_source_commit']=='765643ea2bf0a0035023f1376ed136223f52ba3c'
          assert metadata['build_run_id']==39886424651
          assert metadata['fully_qualified'] is False
          expected={'ITOM-1.1.0-DEV6.apk':metadata['persistent_signed_apk']['persistent_signed_sha256']}
          for line in metadata['linux']['sha256sums'].splitlines():
              digest,name=line.split();expected[name]=digest
          for name,digest in expected.items():
              assert hashlib.sha256((Path('release-assets')/name).read_bytes()).hexdigest()==digest,name
          Path('release-assets/SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name,digest in sorted(expected.items())))
          PY
          java -jar "$PACKAGE_ROOT/tools/apksigner.jar" verify --verbose --print-certs release-assets/ITOM-1.1.0-DEV6.apk > release-assets/SIGNER.txt
          python3 - <<'PY'
          from pathlib import Path
          report=Path('release-assets/SIGNER.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: 47d0d87a99b31e32d7f8b9e5f199d3155c5626c324aa7a29f93c42db1d18e0a6' in report
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in report
          PY
          cp archives/1.1.0/DEV6_BUILD.json archives/1.1.0/DEV6_TESTING.md release-assets/
          cp archives/1.1.0/experiments/dev6-byte-headroom/{RESULTS.md,RESULTS.json,DEV5_COMPARISON.json,KNOWN_FAILURES.json} release-assets/
          (cd "$PACKAGE_ROOT/lab-results" && zip -q -r "$GITHUB_WORKSPACE/release-assets/ITOM-DEV6-lab-results.zip" .)
          python3 - <<'PY_SUMS'
          from pathlib import Path
          import hashlib
          root=Path('release-assets')
          root.joinpath('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.name!='SHA256SUMS'))
          PY_SUMS
      - name: Publish prerelease only after verifying uploaded hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v1.1.0-dev6
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.0-dev6")' > "$RUNNER_TEMP/existing-release.json"
          if [ -s "$RUNNER_TEMP/existing-release.json" ]; then
            python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/existing-release.json"))["draft"], "Refusing to replace a published release"'
          else
            gh release create "$tag" --draft --prerelease --latest=false \
              --target 765643ea2bf0a0035023f1376ed136223f52ba3c \
              --title 'ITOM 1.1.0 DEV6 — experimental testing RC' \
              --notes-file archives/1.1.0/DEV6_TESTING.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          # Draft releases with an unpublished tag are found through the collection.
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "v1.1.0-dev6")' > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          release=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          assets={a['name']:a for a in release['assets']}
          for path in Path('release-assets').iterdir():
              asset=assets[path.name]
              assert asset['size']==path.stat().st_size,path.name
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest(),path.name
          print('Every uploaded asset size and SHA-256 verified')
          PY
          gh release edit "$tag" --draft=false --prerelease --latest=false
