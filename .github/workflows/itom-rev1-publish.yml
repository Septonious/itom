name: Publish verified ITOM 0.9.2-Rev1 artifacts
on:
  push:
    branches: [main]
    paths:
      - archives/0.9.2-Rev1/manifest.json
      - tools/publish_itom_rev1.py
      - .github/workflows/itom-rev1-publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: itom-0.9.2-Rev1-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out artifact parts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reassemble and verify every artifact
        run: python tools/publish_itom_rev1.py --output "$RUNNER_TEMP/itom-rev1"
      - name: Upload draft, verify remote digests, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.9.2-Rev1
          mapfile -t names < <(python -c 'import json; print("\n".join(x["name"] for x in json.load(open("archives/0.9.2-Rev1/manifest.json"))["assets"]))')
          assets=()
          for name in "${names[@]}"; do
            assets+=("$RUNNER_TEMP/itom-rev1/$name")
          done
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "ITOM 0.9.2-Rev1 transport rework candidate" \
            --notes-file builds/0.9.2-Rev1/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          python tools/publish_itom_rev1.py --verify-release-json "$RUNNER_TEMP/release.json" \
            --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/remote-digest-check"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
