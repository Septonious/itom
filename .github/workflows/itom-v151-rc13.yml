name: ITOM 1.5.1 RC13 Android and Linux build
on:
  push:
    branches: [codex/itom-v151-rc13]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itom-rc13-${{ github.ref }}
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            release/rc13
      - name: Verify the corrected RC13 source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/itom-v151-rc13
          expected=d50186280e5840c6730155d7db849c34f53586c2
          current=$(git rev-parse HEAD:src)
          if [ "$current" != "$expected" ]; then
            test "$current" = 90ffd28ce73734accf005af450566c5efe9bbc11
            cat release/rc13/part-*.patch > "$RUNNER_TEMP/rc13.patch"
            echo "ce9f64739ced2d1e90dcebbcabef245089b081b74df106edcd1d5def66b4cff1  $RUNNER_TEMP/rc13.patch" | sha256sum -c -
            git apply --check --index "$RUNNER_TEMP/rc13.patch"
            git apply --index --whitespace=nowarn "$RUNNER_TEMP/rc13.patch"
            test "$(git rev-parse "$(git write-tree):src")" = "$expected"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "RC13: verified five-second cellular controller, metrics safety and UI source"
            git push origin HEAD:refs/heads/codex/itom-v151-rc13
          fi
          test "$(git rev-parse HEAD:src)" = "$expected"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --output=itom-rc13-exact-source.tar.gz HEAD src
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-RC13-exact-source
          path: itom-rc13-exact-source.tar.gz
          if-no-files-found: error
  native-validation:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.sha }}
          sparse-checkout: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.0-rc20
          path: rc20-reference
          sparse-checkout: testing/rc20/downloads
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Focused dispatcher regressions
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=10 -run '^(TestInteractiveIdlePublisherPreference|TestInteractiveBurstAvoidsFullPoolDuplicationButIsolatedRequestHedges|TestDispatchIndependentInteractiveAdmission|TestMeasuredBulkBurstLeavesInteractivePublicationImmediate|TestAccountProbeRequiresReturnOnOriginalMailbox|TestAccountProbeCancellationReleasesSlot)$' .
      - name: RC4 pacing, maintenance and allocation planner regression tests
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -run 'TestRC3|TestRC4|TestBulkControlUrgency|TestPacingOnly|TestMeasuredBulkBurst|TestInteractiveReceiptsBound' .
      - name: Live four-socket allocation and suspend-resume integration
        working-directory: src/mailstream
        run: |
          go test -race -mod=readonly -count=4 -timeout=5m -run '^(TestAuthenticatedInitialGrant|TestLiveAccountScalingPreservesStream|TestLiveGrantRebalancesDormantAccounts)$' .
      - name: Server allocation and cellular controller tests
        working-directory: src/core
        run: go test -race -mod=readonly -count=3 -run 'Test(RC4|SessionAdmission|BalancedCeiling|AllocationCoverage|Cellular)' ./accountpolicy ./tunnel
      - name: RC4 bounded collection and field allocation regressions
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -run 'TestRC4|TestCollectionRetriesBoundTinyMessagesAfterFailure|TestHistoricalDataUsesBoundedHealthyPagesAndConservativeRetries|TestByteBoundedDataCollectionRetainsDebtUntilFinalAudit' .
      - name: RC5 encrypted exit and storage grant regression tests
        working-directory: src/core
        run: go test -race -mod=readonly -count=3 ./relay ./tunnel -run 'Test(RC5|Relay|WrongKey|DirectFallback|ConcurrentRelay|Cancellation|ShutdownWith|RC4FieldGrant|SessionAdmission)'
      - name: Preserve healthy control writer on cleanup failure
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -run 'TestRC5CollectionFailure|TestRC4Collection|TestRC4SmallProvider' .
      - name: RC7 repeated reconnect with unavailable unallocated account
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -timeout=90s -run '^TestReconnectWithUnallocatedStartupRetry$' .
      - name: RC11 mobile controller, bearer and 30-account regression
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=20 -run '^TestRC11(Mobile|Bearer|Account)' .
      - name: RC13 operational account minimum and stall recovery
        working-directory: src/core
        run: go test -race -mod=readonly -count=20 -run 'Test(RC12|RC13|Cellular)' ./tunnel
      - name: RC13 stalled mobile flow recovery
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=20 -run '^TestRC(12|13)' .
      - name: RC10 retained system folders, protected legacy purge, EOF recovery and RTT controller
        working-directory: src/core
        run: go test -race -mod=readonly -count=20 -run 'Test(Cellular|Purge|ProtectedLegacy|FailedPurge|LifecycleCapacity)' ./mailbox ./manager ./tunnel
      - name: RC7 account availability, control reader recovery and latency regressions
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -timeout=5m -run '^TestRC[78]' .
      - name: RC7 account allocation recovery
        working-directory: src/core
        run: go test -race -mod=readonly -count=3 -run 'TestRC7' ./tunnel
      - name: Verify qualification module dependency closure
        working-directory: src/qualification
        run: go list -mod=readonly -deps ./provider ./worker > /dev/null
      - name: Native qualification gate unit tests
        working-directory: src/qualification
        run: python3 -m unittest test_home_gate
      - name: Full core race-detector suite including native process integration
        working-directory: src/core
        run: go test -race -mod=readonly -timeout=10m ./...
      - name: Repeat native process and full physical socket readiness test
        working-directory: src/core
        run: |
          for attempt in 1 2 3; do
            go test -race -mod=readonly -count=1 -timeout=5m -run '^TestNativeVPNProcessUsesReplacement$' ./tunnel
          done
      - name: Extract verified routing data
        run: python3 src/qualification/rc20_routing_data.py rc20-reference/testing/rc20/downloads/itom-1.5.0-rc20.apk rc20-reference/testing/rc20/downloads/SHA256SUMS "$RUNNER_TEMP/rc20-data"
      - name: Full native tests including real routing datasets
        working-directory: src/native
        run: ITOM_RC20_DATA_DIR="$RUNNER_TEMP/rc20-data" go test -race -mod=readonly ./...
  build:
    needs: [materialize, native-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.sha }}
          sparse-checkout: src
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.5.0-rc20
          path: rc20-reference
          sparse-checkout: testing/rc20/downloads
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and bundle actual RC20 routing data
        run: python3 src/qualification/rc20_routing_data.py rc20-reference/testing/rc20/downloads/itom-1.5.0-rc20.apk rc20-reference/testing/rc20/downloads/SHA256SUMS src/android/app/src/main/assets/routing-data
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Ensure pinned Android SDK and NDK
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          "$manager" --sdk_root="$sdk" --channel=3 'platforms;android-29' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Compile matching ARM64 native AAR
        working-directory: src/native
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p "$(go env GOPATH)/pkg/gomobile" ../android/app/libs
          gomobile bind -trimpath -target=android/arm64 -androidapi=29 -javapkg=org.itom.nativecore -o ../android/app/libs/itom.aar .
      - name: Build development APK and release variant
        working-directory: src/android
        run: gradle --no-daemon :domain:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease
      - name: Build matching Linux AMD64 server
        working-directory: src/core
        run: |
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o ../../dist/itom-linux-amd64.bin ./cmd/itom
      - name: Stage artifacts
        run: |
          cp src/android/app/build/outputs/apk/debug/app-debug.apk dist/itom-1.5.1-rc13-dev-testing.apk
          cp src/android/app/build/outputs/apk/release/app-release-unsigned.apk dist/itom-1.5.1-rc13-dev-release-UNSIGNED.apk
          git rev-parse HEAD > dist/BUILD-SOURCE.txt
          dist/itom-linux-amd64.bin version | grep 'itom-1-5-1-rc13-dev'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/itom-1.5.1-rc13-dev-testing.apk
          cd dist
          sha256sum itom-linux-amd64.bin *.apk BUILD-SOURCE.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-1.5.1-RC13-development
          path: dist/
          if-no-files-found: error
