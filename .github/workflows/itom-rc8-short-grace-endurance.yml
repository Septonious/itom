name: RC8 interactive-grace endurance and low-link controller evidence
on:
  push:
    branches: ["codex/rc8-short-grace-latency"]
    paths: [".github/workflows/itom-rc8-short-grace-endurance.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sustained:
    name: "repeat-three strict 75/75 RTT750 ${{ matrix.streams }} streams"
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        streams: [4,32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc8/source/core/go.mod
          cache: false
      - name: Three independent 60-second rounds with original sockets preserved
        working-directory: archives/1.0.0-rc8/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "3"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=1000s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/endurance.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-grace-three-repeats-${{ matrix.streams }}-evidence
          path: ${{ runner.temp }}/endurance.log
          retention-days: 14
  low-link-diagnostics:
    name: "true cold link ${{ matrix.cap }}Mbps annotated controller timeline"
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - cap: 10
            profile: "10:10,20:10,50:10,150:30"
          - cap: 20
            profile: "20:10,50:10,150:40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc8/source/core/go.mod
          cache: false
      - name: Diagnostics and strict 750ms/zero-timeout start with unchanged release floor
        working-directory: archives/1.0.0-rc8/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_STABILITY_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "0"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_PROFILE: "${{ matrix.profile }}"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "1"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "1"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "1"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=330s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/low-link.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8-low-link-${{ matrix.cap }}-diagnostic-evidence
          path: ${{ runner.temp }}/low-link.log
          retention-days: 14
