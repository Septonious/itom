            upload-delayed/
          if-no-files-found: error

  corporate-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Freeze RC11 and reproduce permanent startup losses
        run: |
          set -euo pipefail
          git fetch origin e3c61864048be2e9a7e4b328b5324a2d91f88d4b --no-tags
          mkdir rc11-source
          git archive e3c61864048be2e9a7e4b328b5324a2d91f88d4b archives/1.1.0/source | tar -x -C rc11-source
          python3 archives/1.1.1/qualification/rc12_regressions.py --reference "$GITHUB_WORKSPACE/rc11-source/archives/1.1.0/source" --out corporate-regressions
      - name: Observe RC11 stuck at 18 of 30 lines on asymmetric corporate link
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out corporate-reference --only candidate --candidate "$GITHUB_WORKSPACE/rc11-source/archives/1.1.0/source/core" --client-upload-mbps 35 --client-download-mbps 50 --existing-create-stall-ms 20000 --duration 1s --streams 4 --idle-probes 4 --post-probes 4
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('corporate-reference/candidate.json').read_text())
          assert not d['success'] and 'readiness' in d['error']
          assert d['diagnostics']['Client']['ActiveLines']==18
          assert d['diagnostics']['Mail']['failed_accounts']==4
          assert {l['account'] for l in d['diagnostics']['Mail']['lines'] if l.get('failure')}=={'a02','a03','a05','a10'}
          PYCODE
      - name: Recover all accounts and complete two constrained upload and download cycles
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out corporate-candidate --only candidate --client-upload-mbps 35 --client-download-mbps 50 --existing-create-stall-ms 20000 --startup-select-refusals 2 --duration 16s --cycles 2 --streams 4 --idle-probes 4 --post-probes 8
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('corporate-candidate/candidate.json').read_text())
          assert d['success'] and d['stage']=='complete' and len(d['Phases'])==4
          assert all(p['success'] for p in d['Phases'])
          assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
          assert d['diagnostics']['Mail']['failed_accounts']==0 and not d['diagnostics']['Session']['closed']
          assert d['Provider']['commands'].get('STALLED_EXISTING_CONTROL_CREATE',0)==0
          assert sum(v for k,v in d['Provider']['commands'].items() if k.startswith('REFUSED_SELECT/'))==16
          assert d['Provider']['connection_rejections']==0
          assert max(d['IdleMS']+d['AfterMS'])<=300 and max(d['LoadedMS'])<=2000
          for p in d['Phases']:
              direction=p['name']
              assert p[direction]['full_phase_mbps'] >= (15 if direction=='upload' else 25)
          lines=d['diagnostics']['Mail']['lines']
          assert all(l['startup_attempts']>=3 for l in lines if l['account'] in ('a02','a03','a05','a10'))
          assert all(l['startup_attempts']==1 for l in lines if l['account'] not in ('a02','a03','a05','a10'))
          PYCODE
      - name: Enforce mailbox message and physical-capacity bounds in final-source candidate traces
        run: |
          python3 - <<'BOUNDS'
          import json,subprocess
          from pathlib import Path
          for result in Path('.').rglob('candidate.json'):
              d=json.loads(result.read_text())
              lines=d.get('diagnostics',{}).get('Mail',{}).get('lines',[])
              if lines and all(l.get('control_message_limit')==2048 for l in lines):
                  subprocess.run(['python3','archives/1.1.1/qualification/check_mailbox_bounds.py',str(result.parent)],check=True)
          BOUNDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailstream-111-final-corporate-replay
          path: |
            corporate-regressions/
            corporate-reference/
            corporate-candidate/
          if-no-files-found: error

  home-service-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Reproduce frozen RC12 failures and reuse physical storage
        run: |
          set -euo pipefail
          git fetch origin 45052ad0054580c9fb89f5609d7a745e2e38f447 --no-tags
          mkdir frozen-rc12
          git archive 45052ad0054580c9fb89f5609d7a745e2e38f447 archives/1.1.0/source | tar -x -C frozen-rc12
          python3 archives/1.1.1/qualification/rc13_regressions.py --reference "$GITHUB_WORKSPACE/frozen-rc12/archives/1.1.0/source" --out home-regressions
      - name: Two speedtests with realistic APPEND service cost independent of network RTT
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out home-service --only candidate --append-service-ms 60 --reject-selected-status --duration 30s --cycles 2 --streams 4 --idle-probes 4 --post-probes 8
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('home-service/candidate.json').read_text())
          assert d['success'] and d['stage']=='complete' and len(d['Phases'])==4
          assert all(p['success'] for p in d['Phases'])
          assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
          assert d['diagnostics']['Mail']['failed_accounts']==0 and not d['diagnostics']['Session']['closed']
          assert d['diagnostics']['Mail']['retired_segments']>0
          assert d['Provider']['connection_rejections']==0 and d['Provider']['commands'].get('REJECTED_SELECTED_STATUS',0)==0
          assert max(d['IdleMS']+d['AfterMS'])<=300 and max(d['LoadedMS'])<=2000
          assert all(l['data_appended_messages']>0 and l['append_completion_ms']>0 for l in d['diagnostics']['Mail']['lines'])
          assert d['targets']['full_phase_100mbps']
          PYCODE
      - name: Enforce mailbox message and physical-capacity bounds in final-source candidate traces
        run: |
          python3 - <<'BOUNDS'
          import json,subprocess
          from pathlib import Path
          for result in Path('.').rglob('candidate.json'):
              d=json.loads(result.read_text())
              lines=d.get('diagnostics',{}).get('Mail',{}).get('lines',[])
              if lines and all(l.get('control_message_limit')==2048 for l in lines):
                  subprocess.run(['python3','archives/1.1.1/qualification/check_mailbox_bounds.py',str(result.parent)],check=True)
          BOUNDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailstream-111-final-home-service
          path: |
            home-regressions/
            home-service/
          if-no-files-found: error

