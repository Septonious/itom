    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Reproduce field-ready RC10 slow-receipt limitation and verify compression protection
        run: |
          set -euo pipefail
          git fetch origin b6d53de7ec97bef2d90582186a8398e409eed283 --no-tags
          mkdir rc10-source
          git archive b6d53de7ec97bef2d90582186a8398e409eed283 archives/1.1.0/source | tar -x -C rc10-source
          python3 archives/1.1.1/qualification/rc11_regressions.py --reference "$GITHUB_WORKSPACE/rc10-source/archives/1.1.0/source" --out upload-regressions
      - name: Two full 30-second uploads with delayed server DATA reads
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out upload-delayed --only candidate --upload-fetch-delay-ms 350 --duration 30s --cycles 2 --streams 4 --idle-probes 4 --post-probes 8
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('upload-delayed/candidate.json').read_text())
          assert d['success'] and d['stage']=='complete' and len(d['Phases'])==4
          assert all(p['success'] for p in d['Phases']) and d['targets']['full_phase_100mbps']
          assert d['Provider']['commands']['DELAYED_DATA_FETCH']>0 and d['Provider']['commands']['MAX_DATA_FETCH_ROWS']>8
          assert d['diagnostics']['Mail']['failed_accounts']==0 and not d['diagnostics']['Session']['closed']
          assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
          assert d['Provider']['connection_rejections']==0
          assert max(d['IdleMS']+d['AfterMS'])<=300 and max(d['LoadedMS'])<=2000
