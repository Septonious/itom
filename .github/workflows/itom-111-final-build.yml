# 1.1.1: retain the thirteen existing gates and compare with accepted RC18.
# Independent service-cost and delayed-FETCH models retain all strict misses.
# Qualify bounded control urgency and explicit normal shutdown diagnostics.
concurrency: {group: itom-mailstream-111-final-build, cancel-in-progress: true}
name: Build ITOM 1.1.1 final with complete acceptance
on:
  workflow_dispatch:
  push:
    branches: ["codex/itom-1.1.1-startup"]
    paths: ["archives/1.1.1/source/**", "archives/1.1.1/qualification/**", ".github/workflows/itom-111-final-build.yml"]

permissions: {contents: read}
env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  SOURCE: archives/1.1.1/source
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Complete normal and race application, native recovery, SDK and source checks
        run: python3 "$SOURCE/tools/build.py" core --race --expect-revision itom-1-1-1-final
      - name: Four-stream 7 Mbps transfer cancellation and new HTTPS recovery
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out weak-link-evidence --only candidate --client-mbps 7 --duration 20s --cancel-download-after 12s --streams 4 --idle-probes 4 --post-probes 8
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('weak-link-evidence/candidate.json').read_text())
          assert d['success'] and d['stage']=='complete',d.get('error')
          assert len(d['Phases'])==2 and all(p['success'] for p in d['Phases'])
          assert not d['diagnostics']['Session']['closed']
          assert d['diagnostics']['Session']['delivery_flight_bytes']==0 and d['diagnostics']['Session']['bulk_outstanding_bytes']==0
          assert d['diagnostics']['Mail']['failed_accounts']==0
          assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
          assert all(v>0 for v in d['AfterMS'])
          assert max(d['IdleMS']+d['AfterMS'])<=300 and max(d['LoadedMS'])<=2000
          assert all(l['IMAPLatencyMillis']>0 for l in d['diagnostics']['Client']['Lines'])
          assert any(l['RTTMillis']>0 and l['DownloadBytes']>0 for l in d['diagnostics']['Client']['Lines'])
          assert d['Provider']['connection_rejections']==0
          PY
      - name: Enforce mailbox message and physical-capacity bounds in final-source candidate traces
        run: |
          python3 - <<'BOUNDS'
          import json,subprocess
          from pathlib import Path
          for result in Path('.').rglob('candidate.json'):
              d=json.loads(result.read_text())
              lines=d.get('diagnostics',{}).get('Mail',{}).get('lines',[])
              if lines and all(l.get('control_message_limit')==2048 for l in lines):
                  subprocess.run(['python3','archives/1.1.1/qualification/check_mailbox_bounds.py',str(result.parent)],check=True)
          BOUNDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailstream-111-final-safety
          path: |
            ${{ env.SOURCE }}/dist/core-*.json
            ${{ env.SOURCE }}/dist/core-*.jsonl
            ${{ env.SOURCE }}/dist/core-*.log
            weak-link-evidence/
          if-no-files-found: error
  throughput:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Sustained one/four streams and 32-stream HTTPS under variable delay
        run: |
          set -euo pipefail
          for streams in 1 4 32; do
            duration=30s
            cycles=1
            if [ "$streams" = 4 ]; then cycles=2; fi
            if [ "$streams" = 32 ]; then duration=12s; fi
            python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out "throughput-$streams" --only candidate --duration "$duration" --cycles "$cycles" --streams "$streams" --idle-probes 4 --post-probes 8
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for streams in (1,4,32):
              d=json.loads(Path(f'throughput-{streams}/candidate.json').read_text())
              assert d['success'] and d['stage']=='complete',d.get('error')
              assert all(p['success'] for p in d['Phases'])
              assert len(d['Phases'])==(4 if streams==4 else 2)
              assert d['diagnostics']['Mail']['failed_accounts']==0 and not d['diagnostics']['Session']['closed']
              assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
              assert d['Provider']['connection_rejections']==0
              assert max(d['IdleMS']+d['AfterMS'])<=300
              assert max(d['LoadedMS'])<=2000
              if streams in (1,4): assert d['targets']['full_phase_100mbps']
          PY
      - name: Enforce mailbox message and physical-capacity bounds in final-source candidate traces
        run: |
          python3 - <<'BOUNDS'
          import json,subprocess
          from pathlib import Path
          for result in Path('.').rglob('candidate.json'):
              d=json.loads(result.read_text())
              lines=d.get('diagnostics',{}).get('Mail',{}).get('lines',[])
              if lines and all(l.get('control_message_limit')==2048 for l in lines):
                  subprocess.run(['python3','archives/1.1.1/qualification/check_mailbox_bounds.py',str(result.parent)],check=True)
          BOUNDS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: mailstream-111-final-throughput, path: "throughput-*/", if-no-files-found: error}
  field-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Reproduce frozen RC8 failures and verify decoder cleanup and manager fixes
        run: |
          set -euo pipefail
          reference=66625b9c3dd40ff7ed60e338bfcae72ee4e9f8e6
          git fetch origin "$reference" --no-tags
          mkdir reference-source
          git archive "$reference" archives/1.1.0/source | tar -x -C reference-source
          python3 archives/1.1.1/qualification/rc9_regressions.py --reference "$GITHUB_WORKSPACE/reference-source/archives/1.1.0/source" --out regression-evidence
      - name: Complete two speedtests with retained control history and early provider EXPUNGE
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out retained-history --only candidate --prefill-control 300 --early-store-expunge --duration 16s --cycles 2 --streams 4 --idle-probes 4 --post-probes 8
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('retained-history/candidate.json').read_text())
          assert d['success'] and d['stage']=='complete' and len(d['Phases'])==4
          assert all(p['success'] for p in d['Phases'])
          assert not d['diagnostics']['Session']['closed'] and d['diagnostics']['Mail']['failed_accounts']==0
          assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
          assert d['Provider']['commands']['EARLY_EXPUNGE']>0 and d['Provider']['connection_rejections']==0
          assert max(d['IdleMS']+d['AfterMS'])<=300 and max(d['LoadedMS'])<=2000
          PYCODE
      - name: Reproduce RC9 idle feedback and verify asymmetric capacity recovery
        run: |
          set -euo pipefail
          git fetch origin a4bb15b3a56b9f8098070eabc71029940682989d --no-tags
          mkdir rc9-source
          git archive a4bb15b3a56b9f8098070eabc71029940682989d archives/1.1.0/source | tar -x -C rc9-source
          python3 archives/1.1.1/qualification/rc10_regressions.py --reference "$GITHUB_WORKSPACE/rc9-source/archives/1.1.0/source" --out feedback-evidence
      - name: Three complete speedtests with historical folders and account metadata interference
        run: |
          set -euo pipefail
          python3 archives/1.1.1/qualification/compare.py --go "$(command -v go)" --out account-interference --only candidate --history-folders 40 --prefill-control 300 --early-store-expunge --account-metadata-delay-ms 40 --idle-observe 20s --duration 20s --cycles 3 --streams 4 --post-probes 8
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('account-interference/candidate.json').read_text())
          assert d['success'] and d['stage']=='complete' and len(d['Phases'])==6
          assert all(p['success'] for p in d['Phases']) and d['targets']['full_phase_100mbps']
          assert not d['diagnostics']['Session']['closed'] and d['diagnostics']['Mail']['failed_accounts']==0
          assert d['diagnostics']['Client']['ActiveLines']==d['diagnostics']['Client']['TotalLines']==30
          # Each endpoint inventories once; raced CREATE may add exact-name verification.
          assert 20<=d['Provider']['commands'].get('LIST',0)<=40
          assert d['Provider']['commands']['LIST']==d['Provider']['commands'].get('CONTROL_BOOTSTRAP_LIST',0) and d['Provider']['connection_rejections']==0
          assert max(d['IdleMS']+d['AfterMS'])<=300 and max(d['LoadedMS'])<=2000
          PYCODE
      - name: Enforce mailbox message and physical-capacity bounds in final-source candidate traces
        run: |
          python3 - <<'BOUNDS'
          import json,subprocess
          from pathlib import Path
          for result in Path('.').rglob('candidate.json'):
              d=json.loads(result.read_text())
              lines=d.get('diagnostics',{}).get('Mail',{}).get('lines',[])
              if lines and all(l.get('control_message_limit')==2048 for l in lines):
                  subprocess.run(['python3','archives/1.1.1/qualification/check_mailbox_bounds.py',str(result.parent)],check=True)
          BOUNDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mailstream-111-final-field-replay
          path: |
            regression-evidence/
            retained-history/
            feedback-evidence/
            account-interference/
          if-no-files-found: error
  linux:
    # Build independently; publication still requires complete safety checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Build matched server binaries and source archive
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for arch in amd64 arm64; do
            (cd "$SOURCE/core" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "$GITHUB_WORKSPACE/release-assets/ITOM-1.1.1-linux-$arch.bin" ./cmd/itom)
          done
          release-assets/ITOM-1.1.1-linux-amd64.bin version
          python3 "$SOURCE/tools/package_sources.py" --output release-assets/ITOM-1.1.1-sources.zip
          cp archives/1.1.1/RELEASE_NOTES.md release-assets/
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE_COMMIT
          (cd release-assets && sha256sum *.bin *.zip > NATIVE_SOURCE_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mailstream-111-final-linux-amd64
          path: release-assets/*-linux-amd64.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mailstream-111-final-linux-arm64
          path: release-assets/*-linux-arm64.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mailstream-111-final-linux-source
          path: |
            release-assets/*.zip
            release-assets/*.md
            release-assets/SOURCE_COMMIT
            release-assets/NATIVE_SOURCE_SHA256SUMS
          if-no-files-found: error
  android:
    # Build independently; publication still requires safety AND both builds.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Build both JNI architectures, compile, unit tests and fatal lint
        run: python3 "$SOURCE/tools/build.py" android --expect-revision itom-1-1-1-final --accept-android-licenses
      - name: Export bounded APK parts and public signing verification tools
        run: |
          set -euo pipefail
          mkdir -p apk-parts android-evidence signing-tools
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path(os.environ['SOURCE']);apk=source/'dist/ITOM-1.1.1.apk'
          raw=apk.read_bytes();print("Verified APK bytes:",len(raw));assert 1_000_000<len(raw)<=128*1024*1024
          report=json.loads((source/'dist/build-report.json').read_text())
          assert report['android_variant']=='release'
          assert report['status']=='passed' and report['source_revision']=='itom-1-1-1-final'
          assert report['apk_identity']=={'application_id':'org.itom.client','version_code':10146,'version_name':'1.1.1'}
          parts=[]
          for n,start in enumerate(range(0,len(raw),8*1024*1024)):
              part=raw[start:start+8*1024*1024];name=f'111-final-apk.part{n:02d}'
              Path('apk-parts',name).write_bytes(part)
              parts.append({'name':name,'bytes':len(part),'sha256':hashlib.sha256(part).hexdigest()})
          Path('android-evidence/manifest.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'apk_bytes':len(raw),'apk_sha256':hashlib.sha256(raw).hexdigest(),'parts':parts},indent=2)+'\n')
          PY
          cp "$SOURCE"/dist/{build-report.json,test-summary.json} android-evidence/
          signer="$(find "$HOME/.cache/itom-build" "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name apksigner.jar -type f -print -quit)"
          test -f "$signer"
          cp "$signer" signing-tools/
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-android-evidence, path: android-evidence/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-signing-tools, path: signing-tools/, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part00, path: apk-parts/111-final-apk.part00, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part01, path: apk-parts/111-final-apk.part01, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part02, path: apk-parts/111-final-apk.part02, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part03, path: apk-parts/111-final-apk.part03, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part04, path: apk-parts/111-final-apk.part04, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part05, path: apk-parts/111-final-apk.part05, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part06, path: apk-parts/111-final-apk.part06, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part07, path: apk-parts/111-final-apk.part07, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part08, path: apk-parts/111-final-apk.part08, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part09, path: apk-parts/111-final-apk.part09, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part10, path: apk-parts/111-final-apk.part10, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part11, path: apk-parts/111-final-apk.part11, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part12, path: apk-parts/111-final-apk.part12, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part13, path: apk-parts/111-final-apk.part13, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part14, path: apk-parts/111-final-apk.part14, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        with: {name: mailstream-111-final-apk-part15, path: apk-parts/111-final-apk.part15, if-no-files-found: warn}
      - name: Enforce mailbox message and physical-capacity bounds in final-source candidate traces
        run: |
          python3 - <<'BOUNDS'
          import json,subprocess
          from pathlib import Path
          for result in Path('.').rglob('candidate.json'):
              d=json.loads(result.read_text())
              lines=d.get('diagnostics',{}).get('Mail',{}).get('lines',[])
              if lines and all(l.get('control_message_limit')==2048 for l in lines):
                  subprocess.run(['python3','archives/1.1.1/qualification/check_mailbox_bounds.py',str(result.parent)],check=True)
