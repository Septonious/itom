name: RC10 bounded cleanup prefetch proof and retained tail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Apply bounded observational prefetch experiment
        run: python3 archives/1.0.0-rc10/experiments/prefetch.py
      - name: Prove unacknowledged DATA stays charged and eligible hints cannot starve
        working-directory: archives/1.0.0-rc10/source/core
        run: go test -p 2 -count=1 -timeout=90s ./tunnel -run 'TestRC10|TestRC8|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix'
      - name: Target worst retained32 download tail; no threshold change
        working-directory: archives/1.0.0-rc10/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          GOMAXPROCS: "2"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_RETAINED_STATE: "1"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/prefetch.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-prefetch-retained32
          path: ${{ runner.temp }}/prefetch.log
          retention-days: 30
