name: ITOM 1.1 retained interactive comparison
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-retained-interactive.yml"]
  workflow_dispatch:
permissions: {contents: read}
env:
  GOTOOLCHAIN: local
  GOWORK: off
  ITOM_RETAINED_GC_FLOOR_MS: "1100"
  ITOM_LOAD_SERVER_RTT_MS: "20"
  ITOM_LOAD_CLIENT_RTT_MS: "40"
  ITOM_LOAD_CLIENT_MBPS: "500"
  ITOM_LOAD_SERVER_MBPS: "1000"
  ITOM_LOAD_LITERAL_PLUS: "0"
  ITOM_LOAD_BINARY_FETCH: "0"
jobs:
  interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: local8-mobile40, divisor: 8, rtt: 40, trace: 0}
          - {name: local8-variable40-180, divisor: 8, rtt: 40, trace: 1}
          - {name: local16-mobile40, divisor: 16, rtt: 40, trace: 0}
          - {name: local16-variable40-180, divisor: 16, rtt: 40, trace: 1}
    env:
      ITOM_LOCAL_CLEANUP_DIVISOR: "${{ matrix.divisor }}"
      ITOM_MODEL_MOBILE_TRACE: "${{ matrix.trace }}"
      ITOM_LOAD_CLIENT_RTT_MS: "${{ matrix.rtt }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Compile unchanged RC2 and candidate with identical additional workload
        run: |
          set -euo pipefail
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/duplex-reclamation/prepare.py "$RUNNER_TEMP/paired"
          for variant in rc2 model; do
            (cd "$RUNNER_TEMP/paired/$variant" && go test -p 2 -tags itomtest -c -o "$RUNNER_TEMP/paired/$variant.test" ./tunnel)
          done
      - name: Retained idle and light probes with exact original deadlines and sockets
        run: |
          set -uo pipefail
          failed=0
          for trial in 1 2; do
            order='rc2 model'; if [ "$trial" = 2 ]; then order='model rc2'; fi
            for variant in $order; do
              if ITOM_EXPERIMENT_LABEL="$variant" "$RUNNER_TEMP/paired/$variant.test" -test.run '^TestRetainedIdleLightReference$' -test.v -test.timeout 180s > "$RUNNER_TEMP/paired/$trial-$variant.log" 2>&1; then
                echo "$trial $variant PASS"
              else
                echo "$trial $variant FAIL"; failed=1
              fi
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-interactive-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/paired/*.log
            ${{ runner.temp }}/paired/provenance.json
          retention-days: 90
