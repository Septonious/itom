name: DEV9 final low-headroom source cold HTTPS against DEV8 and RC2
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-dev9-cold.yml"]
permissions: {contents: read}
jobs:
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fanout: 1, rtt: 5, mobile: 0}
          - {fanout: 4, rtt: 5, mobile: 0}
          - {fanout: 1, rtt: 40, mobile: 1}
          - {fanout: 4, rtt: 40, mobile: 1}
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      ITOM_LOAD_CLIENT_RTT_MS: "${{ matrix.rtt }}"
      ITOM_LOAD_SERVER_RTT_MS: "20"
      ITOM_LOAD_CLIENT_MBPS: "500"
      ITOM_LOAD_SERVER_MBPS: "1000"
      ITOM_LOAD_LITERAL_PLUS: "0"
      ITOM_LOAD_BINARY_FETCH: "0"
      ITOM_MODEL_MOBILE_TRACE: "${{ matrix.mobile }}"
      ITOM_DEV9_COLD_FANOUT: "${{ matrix.fanout }}"
      ITOM_LOAD_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Freeze actual production variants with one identical new fixture
        run: |
          set -euo pipefail
          git fetch origin tag v1.0.0-rc2 --no-tags
          git fetch origin 6ade0182848652152fd8aa9af7a8078dfda27563 --no-tags
          python3 archives/1.1.0/experiments/dev9-real-field/prepare.py "$RUNNER_TEMP/cold"
          mkdir evidence
          cp "$RUNNER_TEMP/cold/DEV9_PROVENANCE.json" evidence/
          for variant in model dev8 rc2; do
            cp archives/1.1.0/experiments/dev9-real-field/cold_start_itomtest_test.go "$RUNNER_TEMP/cold/$variant/tunnel/"
            (cd "$RUNNER_TEMP/cold/$variant" && go test -p 2 -tags itomtest -c -o "$RUNNER_TEMP/cold/$variant.test" ./tunnel)
          done
          sha256sum archives/1.1.0/experiments/dev9-real-field/cold_start_itomtest_test.go > evidence/COLD_FIXTURE_SHA256.txt
      - name: No preceding probe, chat connection or all-account warmup
        run: |
          set -uo pipefail
          failed=0
          for variant in model dev8 rc2; do
            if ITOM_EXPERIMENT_LABEL="$variant" "$RUNNER_TEMP/cold/$variant.test" -test.run '^TestDEV9ColdTLSAtFirstReadyAccount$' -test.v -test.timeout 120s > "evidence/$variant.log" 2>&1; then
              echo "$variant PASS"
            else
              echo "$variant FAIL"; failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev9-cold-fanout${{ matrix.fanout }}-rtt${{ matrix.rtt }}-mobile${{ matrix.mobile }}
          path: evidence/*
          retention-days: 90
