name: RC7 strict prerelease qualification (NO RELEASE unless fully green)
on:
  push:
    branches: ["codex/v1.0.0-rc7"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: archives/1.0.0-rc7/source
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  correctness:
    name: Core integrity, recovery, RC2 regressions, RC7 identity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc7/source/core/go.mod
          cache: false
      - name: Source and immutable application ID check
        working-directory: ${{ env.SOURCE }}
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc7
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('source-info.json').read_text())
          gradle=Path('android/app/build.gradle.kts').read_text()
          assert d["android_application_id"] == "org.itom.client.dev.rev7"
          assert 'applicationId = "org.itom.client"' in gradle
          assert 'applicationIdSuffix = ".dev.rev7"' in gradle
          assert 'versionCode = 10006; versionName = "1.0.0-rc7"' in gradle
          assert 'fieldfix2' not in gradle.lower()
          print('RC2/RC6 app ID preserved: org.itom.client.dev.rev7')
          PY
          python3 -m unittest discover -s tools -p 'test_*.py' -q
      - name: Full Go core/server correctness and recovery
        working-directory: ${{ env.SOURCE }}/core
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=1200s ./... 2>&1 | tee "$RUNNER_TEMP/rc7-core.log"
      - name: Preserve failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-core-evidence
          path: ${{ runner.temp }}/rc7-core.log
          retention-days: 14
  throughput:
    name: "Hard 75/75 and RTT <=750ms, streams ${{ matrix.streams }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        streams: [4, 32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc7/source/core/go.mod
          cache: false
      - name: Real TCP/IMAP fixture, 10 accounts, 60 seconds, no waiver
        working-directory: ${{ env.SOURCE }}/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC7_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "150"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run TestTransportReworkQualification -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/rc7-throughput.log"
      - name: Upload original unedited qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-throughput-${{ matrix.streams }}-streams
          path: ${{ runner.temp }}/rc7-throughput.log
          retention-days: 14
  native:
    name: Matched Linux AMD64 and ARM64 experimental executables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc7/source/core/go.mod
          cache: false
      - name: Build exact RC7 source
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc7
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd core && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "../dist/ITOM-1.0.0-RC7-linux-$arch.bin" ./cmd/itom)
          done
          (cd dist && sha256sum ITOM-1.0.0-RC7-linux-*.bin > RC7-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rc7-native-unqualified
          path: ${{ env.SOURCE }}/dist/ITOM-1.0.0-RC7-linux-*.bin
          retention-days: 14
