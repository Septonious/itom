name: Export verified ITOM 1.1.0 final artifacts
on:
  workflow_dispatch:
  push:
    branches: ["codex/v1.1.0-mailbox-stream-v3"]
    paths: [".github/workflows/itom-110-final-artifacts.yml"]
permissions: {contents: read, actions: read}
concurrency: {group: itom-110-final-artifacts, cancel-in-progress: false}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_CI_SHA: 474364b115fee38d174e75c0e025a108a5ebc0b9
      SOURCE_SHA: 474364b115fee38d174e75c0e025a108a5ebc0b9
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source and successful matched builds and acceptance
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" "$SOURCE_CI_SHA" --no-tags
          git diff --exit-code "$SOURCE_SHA" "$SOURCE_CI_SHA" -- archives/1.1.0/source
          git diff --exit-code "$SOURCE_SHA" HEAD -- archives/1.1.0/source
          gh api "repos/$GH_REPO/actions/runs/42356034542" > "$RUNNER_TEMP/build.json"
          gh api "repos/$GH_REPO/actions/runs/42356034542/jobs?filter=all&per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GH_REPO/actions/runs/42356034407" > "$RUNNER_TEMP/acceptance.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ('build','acceptance'):
              run=json.loads((root/(name+'.json')).read_text())
              assert run['head_sha']==os.environ['SOURCE_SHA' if name=='build' else 'SOURCE_CI_SHA'] and run['status']=='completed' and run['conclusion']=='success'
          executions=json.loads((root/'jobs.json').read_text())['jobs']
          latest={}
          for job in executions:
              key=(job.get('run_attempt',1),job['id'])
              prior=latest.get(job['name'])
              if prior is None or key>(prior.get('run_attempt',1),prior['id']):latest[job['name']]=job
          jobs=list(latest.values())
          assert {j['name']for j in jobs}=={'safety','throughput','field-replay','upload-replay','corporate-replay','home-service-replay','repeated-cleanup-replay','recovered-client-replay','short-runs','mobile-replay','linux','android','paged-collection','release-audit','repeat-field-replay'}
          assert all(j['conclusion']=='success'for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-110-final-linux-*", merge-multiple: true, run-id: 42356034542, github-token: "${{ github.token }}", path: release-assets}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-android-evidence, run-id: 42356034542, github-token: "${{ github.token }}", path: android-evidence}
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-110-final-apk-part*", merge-multiple: true, run-id: 42356034542, github-token: "${{ github.token }}", path: apk-parts}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-signing-tools, run-id: 42356034542, github-token: "${{ github.token }}", path: signing-tools}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-safety, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-safety}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-throughput, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-throughput}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-field-replay, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-field}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-upload-replay, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-upload}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-corporate-replay, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-corporate}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-home-service, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-home}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-repeated-cleanup, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-repeated}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-recovered-client, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-recovered/recovered-client}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: "13567909059", merge-multiple: true, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-short}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-mobile-replay, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-mobile}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-paged-collection, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-paged}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-release-audit, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-audit}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-110-final-repeat-field, run-id: 42356034542, github-token: "${{ github.token }}", path: evidence/hosted-repeat}
      - name: Verify source fingerprints, all model gates, signature and exact export bytes
        run: python3 archives/1.1.0/publication/final/verify_export.py
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-1.1.0-signed-Android, path: release-assets/ITOM-1.1.0.apk, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-1.1.0-server-amd64, path: release-assets/ITOM-1.1.0-linux-amd64.bin, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-1.1.0-server-arm64, path: release-assets/ITOM-1.1.0-linux-arm64.bin, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-1.1.0-sources-and-evidence
          path: |
            release-assets/*
            !release-assets/*.apk
            !release-assets/*.bin
          if-no-files-found: error
          retention-days: 90
