name: Publish verified matched mailbox-stream RC12 testing assets
on:
  workflow_dispatch:
permissions: {contents: write, actions: read}
concurrency: {group: itom-mailstream-rc12-publication, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: 42050253417
      SOURCE_CI_RUN: 42050253387
      QUALIFICATION_RUN: 42050253417
      SOURCE_SHA: 45052ad0054580c9fb89f5609d7a745e2e38f447
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source and all matched builds and safety checks
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" --no-tags
          git diff --exit-code "$SOURCE_SHA" HEAD -- archives/1.1.0/source
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/upstream.json"
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100&filter=all" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_CI_RUN" > "$RUNNER_TEMP/source-ci.json"
          gh api "repos/$GH_REPO/actions/runs/$QUALIFICATION_RUN" > "$RUNNER_TEMP/qualification.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'upstream.json').read_text());assert run['head_sha']==os.environ['SOURCE_SHA'] and run['status']=='completed' and run['conclusion']=='failure'
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          for name in ('safety','throughput','field-replay','upload-replay','corporate-replay','linux','android'):
              hits=[j for j in jobs if j['name']==name];assert hits,name
              latest=sorted(hits,key=lambda j:(j.get('run_attempt',1),j['id']))[-1]
              assert latest['conclusion']==('failure' if name=='upload-replay' else 'success'),name
              if name=='upload-replay':
                  assert [s['name'] for s in latest['steps'] if s['conclusion']=='failure']==['Two full 30-second uploads with delayed server DATA reads']
          source=json.loads((root/'source-ci.json').read_text());assert source['head_sha']==os.environ['SOURCE_SHA'] and source['conclusion']=='success'
          qualification=json.loads((root/'qualification.json').read_text());assert qualification['head_sha']=='45052ad0054580c9fb89f5609d7a745e2e38f447' and qualification['conclusion']=='failure'
          PY
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Verify delivery regression with the correct frozen RC10 runner
        run: |
          set -euo pipefail
          git fetch origin b6d53de7ec97bef2d90582186a8398e409eed283 --no-tags
          mkdir frozen-rc10
          git archive b6d53de7ec97bef2d90582186a8398e409eed283 archives/1.1.0/source | tar -x -C frozen-rc10
          python3 archives/1.1.0/qualification/rc11_regressions.py --reference "$GITHUB_WORKSPACE/frozen-rc10/archives/1.1.0/source" --out delivery-regressions
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          actual=json.loads(Path('delivery-regressions/REGRESSION_RESULTS.json').read_text())
          expected=json.loads(Path('archives/1.1.0/publication/mailstream-rc12/MAILSTREAM_RC12_BUILD.json').read_text())['upload_regressions']
          assert actual==expected and all(v['verified'] for v in actual.values())
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          pattern: mailstream-rc12-linux-*
          merge-multiple: true
          run-id: 42050253417
          github-token: ${{ github.token }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc12-android-evidence, run-id: 42050253417, github-token: "${{ github.token }}", path: android-evidence}
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-rc12-apk-part*", merge-multiple: true, run-id: 42050253417, github-token: "${{ github.token }}", path: apk-parts}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc12-signing-tools, run-id: 42050253417, github-token: "${{ github.token }}", path: signing-tools}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc12-safety, run-id: 42050253417, github-token: "${{ github.token }}", path: evidence/hosted-safety}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc12-throughput, run-id: 42050253417, github-token: "${{ github.token }}", path: evidence/hosted-throughput}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc12-field-replay, run-id: 42050253417, github-token: "${{ github.token }}", path: evidence/hosted-field}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: "13428865482", merge-multiple: true, run-id: 42050253417, github-token: "${{ github.token }}", path: evidence/hosted-upload}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc12-corporate-replay, run-id: 42050253417, github-token: "${{ github.token }}", path: evidence/hosted-corporate}
      - name: Verify complete artifacts, public signature patch and local startup evidence
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check NATIVE_SOURCE_SHA256SUMS)
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=os.environ['SOURCE_SHA'];r=Path('release-assets');pub=Path('archives/1.1.0/publication/mailstream-rc12')
          assert (r/'SOURCE_COMMIT').read_text().strip()==source
          manifest=json.loads(Path('android-evidence/manifest.json').read_text());assert manifest['source_commit']==source
          parts=[]
          for part in manifest['parts']:
              raw=Path('apk-parts',part['name']).read_bytes();assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256'];parts.append(raw)
          apk=b''.join(parts);assert len(apk)==manifest['apk_bytes'] and hashlib.sha256(apk).hexdigest()==manifest['apk_sha256']
          Path('original.apk').write_bytes(apk)
          report=json.loads(Path('android-evidence/build-report.json').read_text())
          assert report['status']=='passed' and report['source_revision']=='itom-1-1-0-mailstream-rc12'
          assert report['apk_identity']=={'application_id':'org.itom.client','version_code':10137,'version_name':'1.1.0-mailstream-rc12-debug'} and report['sha256']==manifest['apk_sha256']
          for name in ('domain_tests','app_unit_tests'):
              assert report[name]['tests']>0 and report[name]['failures']==report[name]['errors']==report[name]['skipped']==0
          assert report['lint']['errors']==0
          reports=list(Path('evidence/hosted-safety').rglob('core-report.json'));assert len(reports)==1
          safety=json.loads(reports[0].read_text());assert safety['status']=='passed' and safety['stage']=='complete'
          for name in ('mailstream_normal_tests','mailstream_race_tests','native_normal_tests','native_race_tests','imap_fork_tests','vet'):assert safety[name]=='passed',name
          assert safety['tests']['failed']==safety['race_tests']['failed']==0
          release=json.loads((pub/'MAILSTREAM_RC12_BUILD.json').read_text());validation=json.loads((pub/'ARTIFACT_VALIDATION.json').read_text())
          assert release['source_commit']==validation['source_commit']==source and not release['artifact_validation_pending']
          assert validation['exit_code']==0 and validation['checks'] and all(validation['checks'].values())
          assert release['build_run_id']==42050253417 and release['source_acceptance_run_id']==42050253387
          assert max(release['hosted_weak_link']['post_rtt_ms'])<=300 and release['hosted_weak_link']['loaded_max_ms']<=2000
          assert release['checks']['frozen_rc8_cleanup_and_close_failures_reproduced_and_fixed']
          replays=json.loads(Path('evidence/hosted-field/regression-evidence/REGRESSION_RESULTS.json').read_text())
          assert replays==release['regression_replays'] and all(v['verified'] for v in replays.values())
          retained=json.loads(Path('evidence/hosted-field/retained-history/candidate.json').read_text())
          assert retained['success'] and len(retained['Phases'])==4 and retained['diagnostics']['Mail']['failed_accounts']==0
          for count in (1,4,32):
              data=json.loads(Path(f'evidence/hosted-throughput/throughput-{count}/candidate.json').read_text())
              assert data['success'] and all(data['targets'][name] for name in ('idle_and_light_rtt','loaded_rtt'))
              if count in (1,4): assert data['targets']['full_phase_100mbps']
          feedback=json.loads(Path('evidence/hosted-field/feedback-evidence/REGRESSION_RESULTS.json').read_text())
          assert feedback==release['feedback_regressions'] and all(v['verified'] for v in feedback.values())
          interference=json.loads(Path('evidence/hosted-field/account-interference/candidate.json').read_text())
          assert interference['success'] and len(interference['Phases'])==6 and interference['targets']['full_phase_100mbps']
          assert interference['Provider']['commands'].get('LIST',0)==0 and interference['diagnostics']['Mail']['failed_accounts']==0
          assert max(interference['IdleMS']+interference['AfterMS'])<=300 and max(interference['LoadedMS'])<=2000
          upload=json.loads(Path('evidence/hosted-upload/upload-delayed/candidate.json').read_text())
          assert upload['success'] and len(upload['Phases'])==4 and not upload['targets']['full_phase_100mbps']
          assert all(p['success'] for p in upload['Phases'])
          assert [{'direction':p['name'],'mbps':p[p['name']]['full_phase_mbps']} for p in upload['Phases']]==release['delayed_upload']['phases']
          assert release['known_failed_gate']=={'job':'upload-replay','requirement':'full_phase_100mbps','attempts':2,'functional_transfers_completed':True}
          assert release['functional_and_safety_qualified'] and not release['performance_qualified']
          assert upload['Provider']['commands']['MAX_DATA_FETCH_ROWS']>8 and upload['Provider']['commands']['DELAYED_DATA_FETCH']>0
          assert upload['diagnostics']['Mail']['failed_accounts']==0 and upload['diagnostics']['Client']['ActiveLines']==upload['diagnostics']['Client']['TotalLines']==30
          assert max(upload['IdleMS']+upload['AfterMS'])<=300 and max(upload['LoadedMS'])<=2000
          corporate=json.loads(Path('evidence/hosted-corporate/corporate-candidate/candidate.json').read_text())
          assert corporate['success'] and len(corporate['Phases'])==4
          assert corporate['diagnostics']['Client']['ActiveLines']==corporate['diagnostics']['Client']['TotalLines']==30
          assert corporate['diagnostics']['Mail']['failed_accounts']==0 and corporate['Provider']['connection_rejections']==0
          assert corporate['Provider']['commands'].get('STALLED_EXISTING_CONTROL_CREATE',0)==0
          assert max(corporate['IdleMS']+corporate['AfterMS'])<=300 and max(corporate['LoadedMS'])<=2000
          reference=json.loads(Path('evidence/hosted-corporate/corporate-reference/candidate.json').read_text())
          assert not reference['success'] and reference['diagnostics']['Client']['ActiveLines']==18
          replays=json.loads(Path('evidence/hosted-corporate/corporate-regressions/REGRESSION_RESULTS.json').read_text())
          assert replays==release['corporate_regressions'] and all(v['verified'] for v in replays.values())
          assert release['initial_delayed_upload']['phases'][0]['mbps']<100
          assert not release['all_performance_targets_met']
          assert release['startup_cycles']==6 and release['server_restarts_in_startup_checks']==2 and release['signer_unchanged']
          for arch,digest in release['server_sha256'].items():assert hashlib.sha256((r/f'ITOM-1.1.0-MAILSTREAM-RC12-linux-{arch}.bin').read_bytes()).hexdigest()==digest
          PY
          python3 archives/1.1.0/publication/mailstream-rc12/restore_signed_apk.py original.apk release-assets/ITOM-1.1.0-MAILSTREAM-RC12.apk
          java -jar signing-tools/apksigner.jar verify --verbose --print-certs release-assets/ITOM-1.1.0-MAILSTREAM-RC12.apk > release-assets/SIGNER.txt
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          signer=Path('release-assets/SIGNER.txt').read_text();assert 'Signer #1 certificate SHA-256 digest: 47d0d87a99b31e32d7f8b9e5f199d3155c5626c324aa7a29f93c42db1d18e0a6' in signer
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in signer
          report=json.loads(Path('android-evidence/build-report.json').read_text())
          with zipfile.ZipFile('release-assets/ITOM-1.1.0-MAILSTREAM-RC12.apk') as archive:
              for name,digest in report['apk_native_libraries'].items():
                  raw=archive.read(name);assert hashlib.sha256(raw).hexdigest()==digest and b'itom-1-1-0-mailstream-rc12' in raw and b'itom.local/mailstream' in raw and b'bulk_receipt_rtt_ms' in raw
          PY
          cp android-evidence/build-report.json release-assets/ANDROID_BUILD.json
          cp archives/1.1.0/publication/mailstream-rc12/{MAILSTREAM_RC12_BUILD.json,MAILSTREAM_RC12_SOURCE_MANIFEST.json,ARTIFACT_VALIDATION.json,MAILSTREAM-RC12-evidence.zip} release-assets/
          cp archives/1.1.0/MAILSTREAM-RC12_TESTING.md release-assets/
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('release-assets');(root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(root.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - name: Publish downloadable prerelease after all verification
        run: |
          set -euo pipefail
          tag=v1.1.0-mailstream-rc12
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.0-mailstream-rc12")' > "$RUNNER_TEMP/existing.json"
          if [ -s "$RUNNER_TEMP/existing.json" ]; then
            python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/existing.json"))["draft"], "Refusing to overwrite a published release"'
          else
            gh release create "$tag" --draft --prerelease --latest=false --target "$SOURCE_SHA" --title 'ITOM 1.1.0 MAILSTREAM-RC12 — startup recovery testing candidate — upload target unqualified; RC10 remains field-ready baseline' --notes-file archives/1.1.0/MAILSTREAM-RC12_TESTING.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v1.1.0-mailstream-rc12")' > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          release=json.loads(Path(os.environ['RUNNER_TEMP'],'release.json').read_text());assert release['draft'] and release['prerelease']
          assets={a['name']:a for a in release['assets']}
          for p in Path('release-assets').iterdir():
              if p.is_file():assert assets[p.name]['size']==p.stat().st_size and assets[p.name]['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),p.name
          PY
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url,isDraft,isPrerelease,assets
