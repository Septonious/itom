name: RC8 cleanup repeated qualification - 12 cases, no release promotion
on:
  push:
    branches: ["codex/v1.0.0-rc8-development"]
    paths: [".github/workflows/itom-rc8-cleanup-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: archives/1.0.0-rc8/source
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  sustained:
    name: ${{ matrix.streams }} streams, retained=${{ matrix.retained }}, two 60s rounds
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        streams: [1, 4, 32]
        retained: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc8/source/core/go.mod
          cache: false
      - name: Preserve strict throughput, trailing windows, RTT, probes and sockets
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_RETAINED_STATE: "${{ matrix.retained }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "2"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=600s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/rc8-cleanup-load.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8-cleanup-${{ matrix.streams }}-streams-retained-${{ matrix.retained }}
          path: ${{ runner.temp }}/rc8-cleanup-load.log
          retention-days: 14
