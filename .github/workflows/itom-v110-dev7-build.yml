name: Verify and build DEV7 experimental packages; keep original performance/race failures visible
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-dev7-build.yml"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
env:
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  core:
    name: DEV7 exact-source correctness, proofs and accounting races
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Stage and verify complete identity
        run: |
          python3 archives/1.1.0/experiments/field-feedback/stage.py "$RUNNER_TEMP/dev7"
          python3 "$RUNNER_TEMP/dev7/tools/build.py" check --expect-revision itom-1-1-0-dev7
          cd "$RUNNER_TEMP/dev7/tools"
          python3 -m unittest test_launcher
      - name: Full correctness and new proof regressions; original assertions
        working-directory: ${{ runner.temp }}/dev7/core
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=900s ./...
          go test -count=10 -timeout=180s ./tunnel -run '^TestRev7CappedMixedSocketsRepairWithoutLosingOriginalStream$'
          go test -race -p 2 -count=1 -timeout=180s ./journal ./wallet ./flow ./datapath ./mailbox
          go test -race -p 2 -count=1 -timeout=180s ./tunnel -run 'TestDEV6|TestDEV7|TestRev7AcceptedControl|TestRev7CloseDuringControlRepair|TestRev7CappedMixedSocketsRepair' -v
  linux:
    needs: [core]
    if: ${{ needs.core.result == 'success' }}
    name: Compile experimental Linux artifacts (not a qualified release)
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Stage the exact grant-aware DEV7 source
        run: |
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/field-feedback/stage.py "$RUNNER_TEMP/dev7"
          echo "SOURCE=$RUNNER_TEMP/dev7" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Match revision, build both server architectures
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' 'EXPERIMENTAL ITOM 1.1.0 DEV7; NOT STABLE OR FIELD QUALIFIED.' 'Commit ${{ github.sha }}. Performance gate result: see original comparison run 39945001132; individual failed rounds and field-capacity misses retained; no field qualification.' 'Do not reset journals, wallets or Android app data. Preserve private server state when migrating.' > dist/TESTING_NOTES.txt
          python3 tools/build.py check --expect-revision itom-1-1-0-dev7
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd core && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "../dist/ITOM-1.1.0-DEV7-linux-$arch.bin" ./cmd/itom)
            strings "dist/ITOM-1.1.0-DEV7-linux-$arch.bin" | grep -q 'itom-1-1-0-dev7'
            test "$(stat -c %s "dist/ITOM-1.1.0-DEV7-linux-$arch.bin")" -gt 1000000
          done
          (cd dist && sha256sum ITOM-1.1.0-DEV7-linux-*.bin > NATIVE_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: v110-dev7-model-linux
          path: |
            ${{ env.SOURCE }}/dist/ITOM-1.1.0-DEV7-linux-*.bin
            ${{ env.SOURCE }}/dist/TESTING_NOTES.txt
            ${{ env.SOURCE }}/dist/NATIVE_SHA256SUMS
          if-no-files-found: error
          retention-days: 30
  android:
    needs: [core]
    if: ${{ needs.core.result == 'success' }}
    name: Compile experimental APK, SDK tests, lint and JNI
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      ITOM_ANDROID_KEYSTORE_B64: ${{ secrets.ITOM_ANDROID_KEYSTORE_B64 }}
      ITOM_ANDROID_STORE_PASSWORD: ${{ secrets.ITOM_ANDROID_STORE_PASSWORD }}
      ITOM_ANDROID_KEY_ALIAS: ${{ secrets.ITOM_ANDROID_KEY_ALIAS }}
      ITOM_ANDROID_KEY_PASSWORD: ${{ secrets.ITOM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - name: Stage the exact grant-aware DEV7 source
        run: |
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/field-feedback/stage.py "$RUNNER_TEMP/dev7"
          echo "SOURCE=$RUNNER_TEMP/dev7" >> "$GITHUB_ENV"
      - name: Load optional persistent signing key from Actions secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SIGNING'
          import base64, os
          from pathlib import Path
          names = ('ITOM_ANDROID_KEYSTORE_B64', 'ITOM_ANDROID_STORE_PASSWORD', 'ITOM_ANDROID_KEY_ALIAS', 'ITOM_ANDROID_KEY_PASSWORD')
          present = [bool(os.environ.get(n)) for n in names]
          if any(present) and not all(present):
              raise SystemExit('Incomplete persistent signing setup; configure all four ITOM_ANDROID signing secrets')
          if all(present):
              target = Path(os.environ['RUNNER_TEMP']) / 'itom-signing.jks'
              target.write_bytes(base64.b64decode(''.join(os.environ[names[0]].split()), validate=True))
              target.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'ITOM_ANDROID_SIGNING_STORE_FILE={target}\n')
              print('Persistent signing key loaded; private key is never an artifact')
          else:
              print('No persistent signing secrets: temporary debug signer; in-place update compatibility is NOT assured')
          PY_SIGNING
      - name: Pin SDK/JDK/NDK and build exact 1.1 development application
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' 'EXPERIMENTAL ITOM 1.1.0 DEV7; NOT STABLE OR FIELD QUALIFIED.' 'Commit ${{ github.sha }}. Performance gate result: see original comparison run 39945001132; individual failed rounds and field-capacity misses retained; no field qualification.' 'If signing secrets are absent this APK uses a temporary debug signer. A signature mismatch must not be solved by erasing wallet data.' > dist/TESTING_NOTES.txt
          python3 tools/build.py android --expect-revision itom-1-1-0-dev7 --accept-android-licenses
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          meta=json.loads(Path('android/app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert meta['applicationId']=='org.itom.client', meta
          assert any(x['versionCode']==10107 and x['versionName']=='1.1.0-dev7-debug' for x in meta['elements'])
          apk=Path('dist/ITOM-1.1.0-DEV7-debug.apk')
          assert apk.stat().st_size > 1000000
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert b'itom-1-1-0-dev7' in z.read(f'lib/{abi}/libgojni.so')
          PY
          signer="$(find "$HOME/.cache/itom-build" -type f -path '*/build-tools/36.0.0/apksigner' -print -quit)"
          test -x "$signer"
          "$signer" verify --print-certs dist/ITOM-1.1.0-DEV7-debug.apk > dist/SIGNER.txt
      - name: Hash APK
        working-directory: ${{ env.SOURCE }}/dist
        run: sha256sum ITOM-1.1.0-DEV7-debug.apk > APK_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: v110-dev7-model-android
          path: |
            ${{ env.SOURCE }}/dist/ITOM-1.1.0-DEV7-debug.apk
            ${{ env.SOURCE }}/dist/SIGNER.txt
            ${{ env.SOURCE }}/dist/APK_SHA256SUMS
            ${{ env.SOURCE }}/dist/TESTING_NOTES.txt
            ${{ env.SOURCE }}/dist/test-summary.json
            ${{ env.SOURCE }}/dist/lint-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify entire APK, export all chunks and bound each archive
        env:
          APK_INPUT: ${{ env.SOURCE }}/dist
          APK_EXPORT: ${{ runner.temp }}/apk-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,hashlib,zipfile,json,shutil
          source=next(Path(os.environ['APK_INPUT']).rglob('ITOM-1.1.0-DEV7-debug.apk'))
          data=source.read_bytes();sha=hashlib.sha256(data).hexdigest()
          root=Path(os.environ['APK_EXPORT']);root.mkdir()
          chunks=[]
          for index,offset in enumerate(range(0,len(data),4<<20)):
              part=data[offset:offset+(4<<20)];name=f'apk.part-{index:03d}'
              zpath=root/(name+'.zip')
              with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:z.writestr(name,part)
              chunks.append({'index':index,'name':name,'sha256':hashlib.sha256(part).hexdigest(),'size':len(part),'zip_size':zpath.stat().st_size})
          sizes=[0,0,0]
          for part in sorted(chunks,key=lambda x:x['zip_size'],reverse=True):
              group=min(range(3),key=lambda i:sizes[i]);part['group']=group;sizes[group]+=part['zip_size']
              target=root/f'group-{group}';target.mkdir(exist_ok=True);shutil.move(root/(part['name']+'.zip'),target/(part['name']+'.zip'))
          assert max(sizes)<15<<20, sizes
          manifest={'source_build_commit':os.environ['GITHUB_SHA'],'source_run_id':os.environ['GITHUB_RUN_ID'],'apk_sha256':sha,'apk_bytes':len(data),'parts':sorted(chunks,key=lambda x:x['index']),'group_zip_bytes':sizes}
          assert sum(p['size'] for p in chunks)==len(data)
          for i in range(3):(root/f'group-{i}'/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Complete APK verified',len(data),'bytes;',len(chunks),'parts; group sizes',sizes)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dev7-complete-apk-group-0
          path: ${{ runner.temp }}/apk-export/group-0/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dev7-complete-apk-group-1
          path: ${{ runner.temp }}/apk-export/group-1/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dev7-complete-apk-group-2
          path: ${{ runner.temp }}/apk-export/group-2/*
          compression-level: 0
          if-no-files-found: error
      - name: Export public APK verifier
        working-directory: ${{ env.SOURCE }}
        run: |
          mkdir -p dist/signing-tools
          signer="$(find "$HOME/.cache/itom-build" -type f -path '*/build-tools/36.0.0/apksigner' -print -quit)"
          cp "$(dirname "$signer")/lib/apksigner.jar" dist/signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: v110-dev7-public-signing-tools
          path: ${{ env.SOURCE }}/dist/signing-tools/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v110-dev7-model-android-build-evidence
          path: |
            ${{ env.SOURCE }}/dist/build.log
            ${{ env.SOURCE }}/dist/native-build.log
            ${{ env.SOURCE }}/dist/build-report.json
            ${{ env.SOURCE }}/dist/test-summary.json
            ${{ env.SOURCE }}/dist/app-test-summary.json
            ${{ env.SOURCE }}/dist/lint-summary.json
          retention-days: 30
