name: ITOM 1.5.1 native qualification screen
on:
  push:
    branches: [codex/itom-v151-interactive-isolation, codex/itom-v151-android-integration, codex/itom-v151-rc6]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src
          fetch-depth: 1
      - name: Export exact Go source
        run: git archive --format=tar.gz --output=itom-v151-source.tar.gz HEAD src
      - uses: actions/upload-artifact@v4
        with:
          name: itom-v151-exact-source
          path: itom-v151-source.tar.gz
          if-no-files-found: error
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Focused dispatcher regressions
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=10 -run '^(TestInteractiveIdlePublisherPreference|TestInteractiveBurstAvoidsFullPoolDuplicationButIsolatedRequestHedges|TestDispatchIndependentInteractiveAdmission|TestMeasuredBulkBurstLeavesInteractivePublicationImmediate|TestAccountProbeRequiresReturnOnOriginalMailbox|TestAccountProbeCancellationReleasesSlot)$' .
      - name: RC4 pacing, maintenance and allocation planner regression tests
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -run 'TestRC3|TestRC4|TestBulkControlUrgency|TestPacingOnly|TestMeasuredBulkBurst|TestInteractiveReceiptsBound' .
      - name: Live four-socket allocation and suspend-resume integration
        working-directory: src/mailstream
        run: |
          go test -race -mod=readonly -count=4 -timeout=5m -run '^(TestAuthenticatedInitialGrant|TestLiveAccountScalingPreservesStream|TestLiveGrantRebalancesDormantAccounts)$' .
      - name: Server allocation and cellular controller tests
        working-directory: src/core
        run: go test -race -mod=readonly -count=3 -run 'Test(RC4|SessionAdmission|BalancedCeiling|AllocationCoverage|Cellular)' ./accountpolicy ./tunnel
      - name: RC5 encrypted exit and storage grant regression tests
        working-directory: src/core
        run: go test -race -mod=readonly -count=3 ./relay ./tunnel -run 'Test(RC5|Relay|WrongKey|DirectFallback|ConcurrentRelay|Cancellation|ShutdownWith|RC4FieldGrant|SessionAdmission)'
      - name: Preserve healthy control writer on cleanup failure
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -run 'TestRC5CollectionFailure|TestRC4Collection|TestRC4SmallProvider' .
      - name: RC6 repeated reconnect with unavailable unallocated account
        working-directory: src/mailstream
        run: go test -race -mod=readonly -count=3 -timeout=90s -run '^TestReconnectWithUnallocatedStartupRetry$' .
      - name: RC6 offline purge recovery and retention safety
        working-directory: src/core
        run: go test -race -mod=readonly -count=3 -run 'TestPurgeRetryFreshConnection|TestFailedPurgePreservesLocalCapacity' ./manager
      - name: Verify qualification module dependency closure
        working-directory: src/qualification
        run: go list -mod=readonly -deps ./provider ./worker > /dev/null
      - name: Native qualification gate unit tests
        working-directory: src/qualification
        run: python3 -m unittest test_home_gate
      - name: Eight-account native screen
        id: native_screen
        run: python3 src/qualification/run_home.py "$RUNNER_TEMP/itom-screen" --screen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itom-v151-native-screen
          path: ${{ runner.temp }}/itom-screen/
          if-no-files-found: ignore
      - name: Encrypted exit native screen
        if: ${{ !cancelled() && steps.native_screen.outcome != 'skipped' }}
        run: python3 src/qualification/run_home.py "$RUNNER_TEMP/itom-exit-screen" --screen --encrypted-exit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itom-v151-encrypted-exit-screen
          path: ${{ runner.temp }}/itom-exit-screen/
          if-no-files-found: ignore
      - name: Full native qualification matrix
        run: python3 src/qualification/run_home.py "$RUNNER_TEMP/itom-matrix"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itom-v151-native-matrix
          path: ${{ runner.temp }}/itom-matrix/
          if-no-files-found: ignore
