name: RC10 measured cold uplink with original RC2 recovery; two targeted blockers
on:
  push:
    branches: ["codex/v1.0.0-rc10-development"]
    paths: [".github/workflows/itom-rc10-combined-targeted.yml", "archives/1.0.0-rc10/experiments/client_cold.py", "archives/1.0.0-rc10/experiments/prefetch.py", "archives/1.0.0-rc10/experiments/preparation_cold.py", "archives/1.0.0-rc10/experiments/calibration.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: retained32
            retained: "1"
            profile: ""
            early: "0"
            hard: "1"
            stability: "0"
          - title: early10
            retained: "0"
            profile: "10:10,20:10,50:10,150:30"
            early: "1"
            hard: "0"
            stability: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Apply explicit experimental selection; original RC2 flight and growth
        run: |
          python3 archives/1.0.0-rc10/experiments/apply.py cleanup4
          python3 archives/1.0.0-rc10/experiments/client_cold.py
          python3 archives/1.0.0-rc10/experiments/prefetch.py
          python3 archives/1.0.0-rc10/experiments/preparation_cold.py
          python3 archives/1.0.0-rc10/experiments/calibration.py
      - name: Verify escape accounting, invisible BODY recovery and cancellation
        working-directory: archives/1.0.0-rc10/source/core
        run: go test -p 2 -count=1 -timeout=180s ./tunnel -run 'TestPreparationSharesPhysicalCapacityAndCancellation|TestRC10|TestRC9|TestRC8|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|TestRev4DelayedBodiesAndReaderRestartsKeepEveryTCPStream|TestRev4RetainedStateMixedTrafficAndNextTransfer|TestRev4LongBlackoutPreservesInflightTCPAndMessages'
      - name: Unchanged strict throughput, tail, RTT, probe and socket criteria
        working-directory: archives/1.0.0-rc10/source/core
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOWORK: off
          GOMAXPROCS: "2"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "${{ matrix.hard }}"
          ITOM_STABILITY_QUALIFICATION: "${{ matrix.stability }}"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "32"
          ITOM_LOAD_RETAINED_STATE: "${{ matrix.retained }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_PROFILE: "${{ matrix.profile }}"
          ITOM_LOAD_PROVIDER_PROFILE_EARLY: "${{ matrix.early }}"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=300s -run '^TestTransportReworkQualification$' -v ./tunnel 2>&1 | tee "$RUNNER_TEMP/combined.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-cold-uplink-${{ matrix.title }}
          path: ${{ runner.temp }}/combined.log
          retention-days: 30
