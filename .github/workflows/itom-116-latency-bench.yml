name: ITOM 1.1.6 RTT optimization experiments
on:
  push:
    branches: [codex/itom-1.1.6-low-latency]
    paths:
      - "archives/1.1.6/source/mailstream/**"
      - "archives/1.1.6/qualification/**"
      - ".github/workflows/itom-116-latency-bench.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itom-116-latency-bench
  cancel-in-progress: true
jobs:
  paired-rtt:
    name: "RTT baseline vs candidate / ${{ matrix.profile }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: home-icmp
            bitrate: "500"
            extra: ""
          - profile: home
            bitrate: "500"
            extra: ""
          - profile: mobile
            bitrate: "160"
            extra: "--client-upload-mbps 90 --client-download-mbps 160"
          - profile: mobile-20
            bitrate: "20"
            extra: "--client-upload-mbps 5 --client-download-mbps 20"
          - profile: home-contention
            bitrate: "500"
            extra: "--append-service-ms 12 --bulk-publish-delay-ms 16"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Verify RC-specific Go scheduling tests
        working-directory: archives/1.1.6/source/mailstream
        run: go test -count=1 -timeout=120s -run '^TestRC116' -v .
      - name: Measure ASCII85 encoding CPU throughput on GitHub runner
        if: ${{ matrix.profile == 'mobile-20' }}
        working-directory: archives/1.1.6/source/mailstream
        run: go test -run '^$' -bench '^BenchmarkRC116MandatoryMIMEEncoding' -benchtime=200ms -count=1
      - name: Measure five paired independent RTT distributions
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          BITRATE: ${{ matrix.bitrate }}
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          model="$PROFILE"
          if [[ "$model" == "home-contention" ]]; then model=home; fi
          if [[ "$model" == "mobile-20" ]]; then model=mobile; fi
          for n in 1 2 3 4 5; do
            order=baseline-first
            if [[ "$n" == "2" || "$n" == "4" ]]; then order=candidate-first; fi
            python3 archives/1.1.6/qualification/compare.py --go "$(command -v go)" \
              --out "bench-$PROFILE-$n" \
              --baseline archives/1.1.5/source/core --baseline-is-mailstream \
              --latency-profile "$model" --client-mbps "$BITRATE" $EXTRA \
              --accounts 15 --duration 8s --streams 8 --idle-probes 30 \
              --post-probes 30 --order "$order"
          done
      - name: Print paired RTT medians, p95 and throughput, aggregate across repeats
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 - <<'PY'
          import os,statistics,json
          from pathlib import Path
          profile=os.environ['PROFILE']
          runs=[]
          for i in (1,2,3,4,5):
              root=Path(f'bench-{profile}-{i}')
              report=json.loads((root/'SYNTHETIC_RTT_REPORT.json').read_text())
              baseline,candidate=report['results']
              assert baseline['completed'] and candidate['completed']
              runs.append((baseline,candidate))
          print('\nMEASURED TLS APPLICATION RTT —',profile)
          for phase in ('idle','loaded','after'):
              for field in ('median_ms','p95_ms'):
                  a=[pair[0]['rtt'][phase][field] for pair in runs]
                  b=[pair[1]['rtt'][phase][field] for pair in runs]
                  print(f'{phase:>6} {field:>10}: 1.1.5={a}, RC1={b};'
                        f' aggregated median {statistics.median(a):.3f}ms => {statistics.median(b):.3f}ms;'
                        f' delta {statistics.median(b)-statistics.median(a):+.3f}ms')
          for direction in ('upload','download'):
              a=[pair[0]['throughput_mbps'][direction] for pair in runs]
              b=[pair[1]['throughput_mbps'][direction] for pair in runs]
              print(f'{direction:>8} Mbps: 1.1.5={a}, RC1={b};'
                    f' medians {statistics.median(a):.2f} => {statistics.median(b):.2f}')
              if profile not in ('mobile','mobile-20') and min(b)<200:
                  print('WARNING: one run fell below the 200Mbps high-capacity floor')
          PY
      - name: Report five-pair measured provider MIME bytes per application byte
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 -m unittest discover -s archives/1.1.6/qualification -p 'test_mime_efficiency.py' -v
          python3 archives/1.1.6/qualification/mime_efficiency.py \
            "bench-$PROFILE-1" "bench-$PROFILE-2" "bench-$PROFILE-3" \
            "bench-$PROFILE-4" "bench-$PROFILE-5" --out "bench-$PROFILE-mime-efficiency.json"
      - name: Aggregate every measured RTT sample across five paired trials
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 archives/1.1.6/qualification/aggregate_rtt.py \
            "bench-$PROFILE-1" "bench-$PROFILE-2" "bench-$PROFILE-3" \
            "bench-$PROFILE-4" "bench-$PROFILE-5" --out "bench-$PROFILE-aggregate.json"
