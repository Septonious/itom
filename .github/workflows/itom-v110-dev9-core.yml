name: DEV9 dynamic lending full correctness and short service safety
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-dev9-core.yml"]
permissions: {contents: read}
env: {GOTOOLCHAIN: local, GOWORK: off}
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run: {working-directory: archives/1.1.0/source/core}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.1", cache: false}
      - name: Full correctness and vet; no timing exceptions
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=900s ./...
          go test -count=10 -timeout=180s ./tunnel -run '^TestRev7CappedMixedSocketsRepairWithoutLosingOriginalStream$'
      - name: Accounting, mailbox and transport races
        run: |
          set -euo pipefail
          go test -race -p 2 -count=1 -timeout=180s ./journal ./wallet ./flow ./datapath ./mailbox
          go test -race -p 2 -count=1 -timeout=240s ./tunnel -run 'TestDEV9|TestDEV6|TestDEV7|TestDEV8|TestRev7AcceptedControl|TestRev7CloseDuringControlRepair|TestRev7CappedMixedSocketsRepair|TestThroughputModel|TestBoundedResponse|TestResponseSearch|TestDuplexProof|TestRetainedCadence|TestRecoveryPacing|TestRefillTrigger|TestRev7RetainedOutboundCleanup' -v
