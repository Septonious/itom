name: Export verified RC13 signed testing artifacts
on:
  push:
    branches: ["codex/v1.1.0-mailbox-stream-v3"]
    paths: [".github/workflows/itom-mailstream-rc13-artifacts.yml"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: itom-mailstream-rc13-artifacts, cancel-in-progress: false}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: d59dbc47c10673d753daadf8e4c7bfb51f97899d
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source and successful matched builds and acceptance
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" --no-tags
          git diff --exit-code "$SOURCE_SHA" HEAD -- archives/1.1.0/source
          gh api "repos/$GH_REPO/actions/runs/42099145973" > "$RUNNER_TEMP/build.json"
          gh api "repos/$GH_REPO/actions/runs/42099145973/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GH_REPO/actions/runs/42099145688" > "$RUNNER_TEMP/acceptance.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ('build','acceptance'):
              run=json.loads((root/(name+'.json')).read_text())
              assert run['head_sha']==os.environ['SOURCE_SHA'] and run['status']=='completed' and run['conclusion']=='success'
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          assert {j['name']for j in jobs}=={'safety','throughput','field-replay','upload-replay','corporate-replay','home-service-replay','linux','android'}
          assert all(j['conclusion']=='success'for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-rc13-linux-*", merge-multiple: true, run-id: 42099145973, github-token: "${{ github.token }}", path: release-assets}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-android-evidence, run-id: 42099145973, github-token: "${{ github.token }}", path: android-evidence}
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-rc13-apk-part*", merge-multiple: true, run-id: 42099145973, github-token: "${{ github.token }}", path: apk-parts}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-signing-tools, run-id: 42099145973, github-token: "${{ github.token }}", path: signing-tools}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-safety, run-id: 42099145973, github-token: "${{ github.token }}", path: evidence/hosted-safety}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-throughput, run-id: 42099145973, github-token: "${{ github.token }}", path: evidence/hosted-throughput}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-field-replay, run-id: 42099145973, github-token: "${{ github.token }}", path: evidence/hosted-field}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-upload-replay, run-id: 42099145973, github-token: "${{ github.token }}", path: evidence/hosted-upload}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-corporate-replay, run-id: 42099145973, github-token: "${{ github.token }}", path: evidence/hosted-corporate}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc13-home-service, run-id: 42099145973, github-token: "${{ github.token }}", path: evidence/hosted-home}
      - name: Verify source fingerprints, all model gates, signature and exact export bytes
        run: python3 archives/1.1.0/publication/mailstream-rc13/verify_export.py
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-MAILSTREAM-RC13-signed-Android, path: release-assets/ITOM-1.1.0-MAILSTREAM-RC13.apk, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-MAILSTREAM-RC13-server-amd64, path: release-assets/ITOM-1.1.0-MAILSTREAM-RC13-linux-amd64.bin, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-MAILSTREAM-RC13-server-arm64, path: release-assets/ITOM-1.1.0-MAILSTREAM-RC13-linux-arm64.bin, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-MAILSTREAM-RC13-sources-and-evidence
          path: |
            release-assets/*
            !release-assets/*.apk
            !release-assets/*.bin
          if-no-files-found: error
          retention-days: 90
