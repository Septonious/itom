name: Publish verified ITOM 1.3.0 DEV2 downloads
on:
  push:
    branches: [codex/itom-v130-dev2-downloads]
    paths: [".github/workflows/itom-v130-dev2-downloads.yml", "testing/v130-dev2/downloads/**"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: itom-v130-dev2-downloads, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.3.0-dev2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Restore the exact locally verified APK and server
        run: |
          python3 - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          base=Path('testing/v130-dev2/downloads')
          manifest=json.loads((base/'manifest.json').read_text())
          assert manifest['tag']=='v1.3.0-dev2'
          assert {f['name']for f in manifest['files']}=={'itom-1.3.0-dev2.apk','itom-1.3.0-dev2.bin'}
          out=Path('release-assets');out.mkdir()
          for f in manifest['files']:
              assert all(Path(n).name==n and n.endswith('.part')for n in f['parts'])
              encoded=b''.join((base/n).read_bytes()for n in f['parts'])
              assert len(encoded)==f['payload_bytes']
              data=gzip.decompress(encoded)if f['encoding']=='gzip'else encoded
              assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256']
              (out/f['name']).write_bytes(data)
              print(f['name'],len(data),'bytes; SHA-256 verified')
          source=manifest['source_snapshot']
          snapshot=b''.join((base/n).read_bytes()for n in source['parts'])
          assert len(snapshot)==source['bytes'] and hashlib.sha256(snapshot).hexdigest()==source['sha256']
          print('Matching source snapshot verified:',manifest['source_commit'])
          PY
      - name: Create a testing draft with only the two requested assets
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/releases?per_page=100" > existing-releases.json
            python3 - <<'PYVERIFY'
          import json,os
          from pathlib import Path
          rows=json.loads(Path('existing-releases.json').read_text())
          matches=[r for r in rows if r['tag_name']==os.environ['TAG']]
          assert len(matches)==1
          r=matches[0]
          assert r['draft'] and r['prerelease'], 'Only the exact unpublished draft may be resumed'
          assert r['body'].strip()==Path('testing/v130-dev2/downloads/RELEASE_NOTES.md').read_text().strip()
          expected={f['name']:f for f in json.loads(Path('testing/v130-dev2/downloads/manifest.json').read_text())['files']}
          assert {a['name']for a in r['assets']}==set(expected)
          for a in r['assets']:
              assert a['state']=='uploaded' and a['size']==expected[a['name']]['bytes']
              if a.get('digest'):assert a['digest']=='sha256:'+expected[a['name']]['sha256']
          print('Resuming the exact existing draft; both assets will be downloaded and checked again.')
          PYVERIFY
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --prerelease --title "ITOM 1.3.0 DEV2 transport rewrite testing" --notes-file testing/v130-dev2/downloads/RELEASE_NOTES.md release-assets/itom-1.3.0-dev2.apk release-assets/itom-1.3.0-dev2.bin
          fi
      - name: Download and verify both assets before publishing
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir release-readback
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          manifest=json.loads(Path('testing/v130-dev2/downloads/manifest.json').read_text())
          expected={f['name']:f for f in manifest['files']}
          actual={p.name for p in Path('release-readback').iterdir()if p.is_file()}
          assert actual==set(expected)
          for name,f in expected.items():
              data=(Path('release-readback')/name).read_bytes()
              assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256']
          rows=json.loads(Path('releases.json').read_text())
          matches=[r for r in rows if r['tag_name']==os.environ['TAG']]
          assert len(matches)==1
          release=matches[0]
          assert release['tag_name']==os.environ['TAG'] and release['draft'] and release['prerelease']
          assert {a['name']for a in release['assets']}==set(expected)
          for asset in release['assets']:
              f=expected[asset['name']]
              assert asset['state']=='uploaded' and asset['size']==f['bytes']
              if asset.get('digest'):assert asset['digest']=='sha256:'+f['sha256']
          with Path(os.environ['GITHUB_ENV']).open('a')as f:f.write('RELEASE_ID='+str(release['id'])+'\n')
          print('Both assets downloaded and verified; draft is ready to publish.')
          PY
      - name: Publish prerelease without changing the latest stable release
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false > published-release.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('published-release.json').read_text())
          assert r['tag_name']==os.environ['TAG'] and not r['draft'] and r['prerelease']
          assert {a['name']for a in r['assets']}=={'itom-1.3.0-dev2.apk','itom-1.3.0-dev2.bin'}
          print(r['html_url'])
          for a in r['assets']:print(a['browser_download_url'])
          PY
