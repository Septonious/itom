name: RC7 calibrated 600Mbps independent duplex qualification
on:
  push:
    branches:
      - codex/v1.0.0-rc7
      - codex/rc7-rc6-control
      - codex/rc7-batch-residence32
    paths: [".github/workflows/itom-rc7-600-benchmark.yml"]
permissions:
  contents: read
jobs:
  calibrated-duplex:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        streams: [1,24,32]
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc7/source/core/go.mod
          cache: false
      - name: Original 600Mbps provider, bounded ten sessions, strict 75/75 and RTT<=750ms
        working-directory: archives/1.0.0-rc7/source/core
        env:
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC7_RELEASE_GATE: "1"
          ITOM_STABILITY_QUALIFICATION: "0"
          ITOM_LOAD_MIN_MBPS: "75"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "10"
          ITOM_LOAD_REPEATS: "1"
          ITOM_LOAD_PROVIDER_MBPS: "600"
          ITOM_LOAD_PROVIDER_CONNECTION_LIMIT: "10"
          ITOM_LOAD_ACCOUNT_SESSIONS: "10"
          ITOM_LOAD_ENDPOINT_CONNECTIONS: "128"
          ITOM_LOAD_UID_HISTORY: "64"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1100"
          ITOM_LOAD_COMMAND_DELAY_MS: "80"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        shell: bash
        run: |
          set -euo pipefail
          go test -p 2 -count=1 -timeout=350s -run TestTransportReworkQualification -v ./tunnel 2>&1 | tee "${RUNNER_TEMP}/rc7-calibrated.log"
      - name: Preserve complete original test evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-calibrated-${{ matrix.streams }}-streams
          path: ${{ runner.temp }}/rc7-calibrated.log
          retention-days: 14
