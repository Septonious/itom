name: Assemble and publish ITOM 1.0.0 RC2 targeted testing build
on:
  push:
    branches: [codex/v1.0.0-rc2]
    paths:
      - archives/1.0.0-rc2/**
      - tools/publish_itom_rc2.py
      - .github/workflows/itom-rc2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: itom-v1-rc2
  cancel-in-progress: false

jobs:
  assemble-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate source and hashed artifact parts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Detect a packaged release
        id: packaged
        shell: bash
        run: |
          if [[ -f archives/1.0.0-rc2/manifest.json ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Development checkpoint only; release assembly and publication skipped.'
          fi
      - name: Reassemble and verify APK, binaries and recorded validation evidence
        if: steps.packaged.outputs.ready == 'true'
        run: python tools/publish_itom_rc2.py --output "$RUNNER_TEMP/itom-v1-rc2"
      - name: Upload draft, verify remote digests, publish targeted testing build
        if: steps.packaged.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.0.0-rc2
          mapfile -t names < <(python -c 'import json; print("\n".join(x["name"] for x in json.load(open("archives/1.0.0-rc2/manifest.json"))["assets"]))')
          assets=()
          for name in "${names[@]}"; do
            assets+=("$RUNNER_TEMP/itom-v1-rc2/$name")
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          release_id=$(python -c 'import json,sys; rows=[r for page in json.load(open(sys.argv[1])) for r in page if r["tag_name"]==sys.argv[2]]; assert len(rows)<=1; print(rows[0]["id"] if rows else "")' "$RUNNER_TEMP/releases.json" "$tag")
          if [[ -z "$release_id" ]]; then
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --prerelease \
              --title "ITOM 1.0.0 RC2 — targeted testing build" \
              --notes-file builds/1.0.0-RC2/RELEASE_NOTES.md
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
            release_id=$(python -c 'import json,sys; rows=[r for page in json.load(open(sys.argv[1])) for r in page if r["tag_name"]==sys.argv[2]]; assert len(rows)==1; print(rows[0]["id"])' "$RUNNER_TEMP/releases.json" "$tag")
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release.json"
          python tools/publish_itom_rc2.py --verify-release-json "$RUNNER_TEMP/release.json" \
            --repository "$GITHUB_REPOSITORY" --expected-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/remote-digest-check"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -F prerelease=true -f make_latest=false > "$RUNNER_TEMP/published-release.json"
