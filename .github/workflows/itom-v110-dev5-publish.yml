name: Publish exact signed DEV5 testing packages
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110-dev5-publish.yml"]
permissions: {contents: write, actions: read}
concurrency:
  group: publish-itom-v110-dev5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v110-dev5-model-android
          run-id: 39843841636
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-apk
      - uses: actions/download-artifact@v4
        with:
          name: v110-dev5-model-linux
          run-id: 39843841636
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@v4
        with:
          name: v110-dev5-public-signing-tools
          run-id: 39843841636
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tools
      - name: Restore exact signed APK and verify all package identities
        env:
          PACKAGE_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir release-assets
          python3 archives/1.1.0/publication/restore_signed_apk.py \
            "$PACKAGE_ROOT/original-apk/ITOM-1.1.0-DEV5-debug.apk" \
            release-assets/ITOM-1.1.0-DEV5.apk
          cp "$PACKAGE_ROOT"/linux/ITOM-1.1.0-DEV5-linux-*.bin release-assets/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          metadata=json.loads(Path('archives/1.1.0/DEV5_BUILD.json').read_text())
          expected={'ITOM-1.1.0-DEV5.apk':metadata['persistent_signed_apk']['persistent_signed_sha256']}
          for line in metadata['linux']['sha256sums'].splitlines():
              digest,name=line.split();expected[name]=digest
          for name,digest in expected.items():
              assert hashlib.sha256((Path('release-assets')/name).read_bytes()).hexdigest()==digest,name
          Path('release-assets/SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name,digest in sorted(expected.items())))
          PY
          java -jar "$PACKAGE_ROOT/tools/apksigner.jar" verify --verbose --print-certs release-assets/ITOM-1.1.0-DEV5.apk > release-assets/SIGNER.txt
          python3 - <<'PY'
          from pathlib import Path
          report=Path('release-assets/SIGNER.txt').read_text()
          assert 'Signer #1 certificate SHA-256 digest: 47d0d87a99b31e32d7f8b9e5f199d3155c5626c324aa7a29f93c42db1d18e0a6' in report
          assert 'Verified using v3 scheme (APK Signature Scheme v3): true' in report
          PY
          cp archives/1.1.0/DEV5_BUILD.json archives/1.1.0/DEV5_TESTING.md release-assets/
      - name: Publish prerelease only after verifying uploaded hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v1.1.0-dev5
          gh release create "$tag" --draft --prerelease --latest=false \
            --target 21cf237482f4e57c83c8a3f8841d6808c28e5ffe \
            --title 'ITOM 1.1.0 DEV5 — experimental testing RC' \
            --notes-file archives/1.1.0/DEV5_TESTING.md
          gh release upload "$tag" release-assets/*
          gh api "repos/$GH_REPO/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          release=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          assets={a['name']:a for a in release['assets']}
          for path in Path('release-assets').iterdir():
              asset=assets[path.name]
              assert asset['size']==path.stat().st_size,path.name
              assert asset['digest']=='sha256:'+hashlib.sha256(path.read_bytes()).hexdigest(),path.name
          print('Every uploaded asset size and SHA-256 verified')
          PY
          gh release edit "$tag" --draft=false --prerelease --latest=false
