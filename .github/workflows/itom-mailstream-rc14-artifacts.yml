name: Export verified RC14 signed testing artifacts
on:
  push:
    branches: ["codex/v1.1.0-mailbox-stream-v3"]
    paths: [".github/workflows/itom-mailstream-rc14-artifacts.yml"]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: itom-mailstream-rc14-artifacts, cancel-in-progress: false}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_CI_SHA: d66775cfbd59b7c0c9b225af628032723dbe9147
      SOURCE_SHA: d66775cfbd59b7c0c9b225af628032723dbe9147
    steps:
      - uses: actions/checkout@v4
      - name: Require exact source and successful matched builds and acceptance
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" "$SOURCE_CI_SHA" --no-tags
          git diff --exit-code "$SOURCE_SHA" "$SOURCE_CI_SHA" -- archives/1.1.0/source
          git diff --exit-code "$SOURCE_SHA" HEAD -- archives/1.1.0/source
          gh api "repos/$GH_REPO/actions/runs/42181961274" > "$RUNNER_TEMP/build.json"
          gh api "repos/$GH_REPO/actions/runs/42181961274/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GH_REPO/actions/runs/42181961268" > "$RUNNER_TEMP/acceptance.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ('build','acceptance'):
              run=json.loads((root/(name+'.json')).read_text())
              assert run['head_sha']==os.environ['SOURCE_SHA' if name=='build' else 'SOURCE_CI_SHA'] and run['status']=='completed' and run['conclusion']=='success'
          jobs=json.loads((root/'jobs.json').read_text())['jobs']
          assert {j['name']for j in jobs}=={'safety','throughput','field-replay','upload-replay','corporate-replay','home-service-replay','repeated-cleanup-replay','recovered-client-replay','linux','android'}
          assert all(j['conclusion']=='success'for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-rc14-linux-*", merge-multiple: true, run-id: 42181961274, github-token: "${{ github.token }}", path: release-assets}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-android-evidence, run-id: 42181961274, github-token: "${{ github.token }}", path: android-evidence}
      - uses: actions/download-artifact@v4
        with: {pattern: "mailstream-rc14-apk-part*", merge-multiple: true, run-id: 42181961274, github-token: "${{ github.token }}", path: apk-parts}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-signing-tools, run-id: 42181961274, github-token: "${{ github.token }}", path: signing-tools}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-safety, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-safety}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-throughput, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-throughput}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-field-replay, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-field}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-upload-replay, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-upload}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-corporate-replay, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-corporate}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-home-service, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-home}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-repeated-cleanup, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-repeated}
      - uses: actions/download-artifact@v4
        with: {name: mailstream-rc14-recovered-client, run-id: 42181961274, github-token: "${{ github.token }}", path: evidence/hosted-recovered/recovered-client}
      - name: Verify source fingerprints, all model gates, signature and exact export bytes
        run: python3 archives/1.1.0/publication/mailstream-rc14/verify_export.py
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-MAILSTREAM-RC14-signed-Android, path: release-assets/ITOM-1.1.0-MAILSTREAM-RC14.apk, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-MAILSTREAM-RC14-server-amd64, path: release-assets/ITOM-1.1.0-MAILSTREAM-RC14-linux-amd64.bin, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: ITOM-MAILSTREAM-RC14-server-arm64, path: release-assets/ITOM-1.1.0-MAILSTREAM-RC14-linux-arm64.bin, if-no-files-found: error, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-MAILSTREAM-RC14-sources-and-evidence
          path: |
            release-assets/*
            !release-assets/*.apk
            !release-assets/*.bin
          if-no-files-found: error
          retention-days: 90
