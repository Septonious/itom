name: RC10 requested field-test APK and server binaries
on:
  push:
    branches: ["codex/v1.0.0-rc10-development"]
    paths: [".github/workflows/itom-rc10-field-test-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: archives/1.0.0-rc10/source
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  core:
    name: Go source integrity, latency selection and account recovery
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: archives/1.0.0-rc10/source/core/go.mod
          cache: false
      - name: Source ID and immutable APK package validation
        working-directory: ${{ env.SOURCE }}
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc10
          python3 -m unittest discover -s tools -p 'test_*.py' -q
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('source-info.json').read_text())
          b=Path('android/app/build.gradle.kts').read_text()
          assert d['android_application_id']=='org.itom.client'
          assert 'applicationId = "org.itom.client"' in b
          assert 'applicationIdSuffix' not in b
          assert 'versionCode = 10009; versionName = "1.0.0-rc10"' in b
          PY
      - name: gofmt go vet and focused field regressions
        working-directory: ${{ env.SOURCE }}/core
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=120s ./tunnel -run 'TestHealthyEndpoint|TestHealthyServerClient|TestScenarioMobileNetworkRegression|TestProviderAccess20Calibration' -v | tee "$RUNNER_TEMP/healthy-model.log"
          go test -p 2 -count=1 -timeout=240s ./journal ./wallet ./flow ./datapath ./mailbox
          go test -p 2 -count=1 -timeout=150s ./tunnel -run 'TestRC10|TestRC8|TestRC7Speedup|TestRC5BulkACK|TestRC5LatestStatus|TestRC2|TestLoadedEchoCannotRaiseIdleCarrierSelectionBaseline|TestLoadedOnlyCarriersUseUnloadedPoolEstimate|TestFieldBulkLeavesTwoReadableAccountsForInteractiveData|TestFieldHTTPSBurstAndCanceledSocketsKeepCarriers|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|TestRev4RetainedStateMixedTrafficAndNextTransfer' -v | tee "$RUNNER_TEMP/rc10-focused.log"
      - name: Race check proof accounting and cleanup cancellation
        working-directory: ${{ env.SOURCE }}/core
        run: go test -race -p 2 -count=1 -timeout=180s ./journal ./wallet ./datapath ./tunnel -run 'TestRC10|TestRC8|TestRC5BulkACK|TestRC5LatestStatus|TestRC2|TestRev4DelayedStreamCannotBlockHealthyStreamPrefix|Test.*(Quota|Unknown|Reclaim|Recovery|Proof)'
      - name: Save regression evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc10-focused-core-evidence
          path: ${{ runner.temp }}/rc10-focused.log
          retention-days: 14
  linux:
    needs: [core]
    name: Build Linux amd64 and arm64
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Match revision, build both server architectures
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc10
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd core && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "../dist/ITOM-1.0.0-RC10-linux-$arch.bin" ./cmd/itom)
            strings "dist/ITOM-1.0.0-RC10-linux-$arch.bin" | grep -q 'itom-1-0-0-rc10'
            test "$(stat -c %s "dist/ITOM-1.0.0-RC10-linux-$arch.bin")" -gt 1000000
          done
          (cd dist && sha256sum ITOM-1.0.0-RC10-linux-*.bin > NATIVE_SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rc10-field-test-linux
          path: ${{ env.SOURCE }}/dist/ITOM-1.0.0-RC10-linux-*.bin
          if-no-files-found: error
          retention-days: 30
  android:
    needs: [core]
    name: Build Android APK, SDK tests, lint and JNI
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Pin SDK/JDK/NDK and build exact RC10 application
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py android --expect-revision itom-1-0-0-rc10 --accept-android-licenses
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          meta=json.loads(Path('android/app/build/outputs/apk/debug/output-metadata.json').read_text())
          assert meta['applicationId']=='org.itom.client', meta
          assert any(x['versionCode']==10009 and x['versionName']=='1.0.0-rc10-debug' for x in meta['elements'])
          apk=Path('dist/ITOM-1.0.0-RC10-debug.apk')
          assert apk.stat().st_size > 1000000
          with zipfile.ZipFile(apk) as z:
              for abi in ('arm64-v8a','armeabi-v7a'):
                  assert b'itom-1-0-0-rc10' in z.read(f'lib/{abi}/libgojni.so')
          PY
          signer="$(find "$HOME/.cache/itom-build" -type f -path '*/build-tools/36.0.0/apksigner' -print -quit)"
          test -x "$signer"
          "$signer" verify --print-certs dist/ITOM-1.0.0-RC10-debug.apk > dist/SIGNER.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rc10-field-test-android
          path: |
            ${{ env.SOURCE }}/dist/ITOM-1.0.0-RC10-debug.apk
            ${{ env.SOURCE }}/dist/SIGNER.txt
            ${{ env.SOURCE }}/dist/test-summary.json
            ${{ env.SOURCE }}/dist/lint-summary.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc10-field-test-android-build-evidence
          path: |
            ${{ env.SOURCE }}/dist/build.log
            ${{ env.SOURCE }}/dist/native-build.log
            ${{ env.SOURCE }}/dist/build-report.json
            ${{ env.SOURCE }}/dist/test-summary.json
            ${{ env.SOURCE }}/dist/app-test-summary.json
            ${{ env.SOURCE }}/dist/lint-summary.json
          retention-days: 30
  source:
    needs: [core]
    name: Package executable RC10 source
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Integrity check and source archive
        working-directory: ${{ env.SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py check --expect-revision itom-1-0-0-rc10
          python3 tools/package_sources.py --output "$GITHUB_WORKSPACE/ITOM-1.0.0-RC10-sources.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rc10-field-test-source
          path: ITOM-1.0.0-RC10-sources.zip
          if-no-files-found: error
          retention-days: 30
  package:
    name: Assemble verified files; testing only, no release tag
    needs: [linux, android, source]
    runs-on: ${{ vars.ITOM_QUALIFICATION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rc10-field-test-linux
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: rc10-field-test-android
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: rc10-field-test-source
          path: package
      - name: Archive matched outputs and source SHA
        shell: bash
        run: |
          set -euo pipefail
          cd package
          test -s ITOM-1.0.0-RC10-debug.apk
          test -s ITOM-1.0.0-RC10-linux-amd64.bin
          test -s ITOM-1.0.0-RC10-linux-arm64.bin
          test -s ITOM-1.0.0-RC10-sources.zip
          printf '%s\n'             'ITOM 1.0.0 RC10 — USER-REQUESTED FIELD TEST BUILD; NOT RELEASE QUALIFIED'             'Build commit: ${{ github.sha }}'             'Update Android and server together. APK app ID org.itom.client.'             'Debug APK: signer compatibility with the installed app is UNVERIFIED. SIGNER.txt records the certificate; do not uninstall or clear state to bypass a mismatch.'             'Do NOT reset accounts, IMAP quota journals, wallets or client identities.'             'Core safety checks passed. Production core matches paired checkpoint522d7cf. Intermittent probe/progress failures, low-capacity ramps and 100ms client upload qualification remain unresolved. No threshold is waived or reported passed.'             'Source thresholds remain unchanged. This build is explicitly authorized for testing; it is not a stable release. See archives/1.0.0-rc10/audit/RC2_HEALTHY_COMPARISON.md.' > TESTING_NOTES.txt
          sha256sum ITOM-1.0.0-RC10-* SIGNER.txt TESTING_NOTES.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
          zip -q ../ITOM-1.0.0-RC10-field-testing-package.zip ./*
      - uses: actions/upload-artifact@v4
        with:
          name: ITOM-1.0.0-RC10-field-testing-package
          path: ITOM-1.0.0-RC10-field-testing-package.zip
          if-no-files-found: error
          retention-days: 30
