name: ITOM 1.1.0 isolated transport qualification
on:
  push:
    branches: ["codex/v1.1.0-transport-rework"]
    paths: [".github/workflows/itom-v110.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: archives/1.1.0/source
  GOTOOLCHAIN: local
  GOWORK: off
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Identity, packaging and Python checks
        run: python3 "$SOURCE/tools/build.py" check --expect-revision itom-1-1-0-dev1
      - name: Full correctness and vet
        working-directory: ${{ env.SOURCE }}/core
        run: |
          set -euo pipefail
          go vet ./...
          go test -p 2 -count=1 -timeout=900s ./...
          go test -race -p 2 -count=1 -timeout=240s ./journal ./wallet ./flow ./datapath
  latency:
    name: Paired idle/light client ${{ matrix.rtt }}ms
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        rtt: [5, 40, 100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Immutable RC2 and same fixtures; compile before measurement
        run: |
          set -euo pipefail
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/prepare_pair.py "$RUNNER_TEMP/paired"
          for variant in rc2 v110; do
            (cd "$RUNNER_TEMP/paired/$variant" && go test -p 2 -tags itomtest -c -o "$RUNNER_TEMP/paired/$variant.test" ./tunnel)
          done
      - name: Three alternating pairs; preserve failures
        env:
          ITOM_LOAD_CLIENT_RTT_MS: "${{ matrix.rtt }}"
        run: |
          set -uo pipefail
          failed=0
          for trial in 1 2 3; do
            order='rc2 v110'; if [ "$trial" = 2 ]; then order='v110 rc2'; fi
            for variant in $order; do
              if ITOM_EXPERIMENT_LABEL="$variant" "$RUNNER_TEMP/paired/$variant.test" -test.run '^TestV110IdleLightReference$' -test.v -test.timeout 150s > "$RUNNER_TEMP/paired/$trial-$variant.log" 2>&1; then
                echo "$trial $variant PASS"
              else
                echo "$trial $variant FAIL"; failed=1
              fi
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v110-latency-${{ matrix.rtt }}
          path: ${{ runner.temp }}/paired/*.log
          retention-days: 90
  throughput:
    name: Paired ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: single, streams: 1, retained: 0, binary: 0, server_rtt: 2}
          - {name: four, streams: 4, retained: 0, binary: 0, server_rtt: 2}
          - {name: multi, streams: 32, retained: 0, binary: 0, server_rtt: 2}
          - {name: retained-single, streams: 1, retained: 1, binary: 0, server_rtt: 2}
          - {name: retained-multi, streams: 32, retained: 1, binary: 0, server_rtt: 2}
          - {name: binary-four, streams: 4, retained: 0, binary: 1, server_rtt: 2}
          - {name: historical-route, streams: 4, retained: 0, binary: 0, server_rtt: 20}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Reconstruct reference and compile both
        run: |
          set -euo pipefail
          git fetch origin tag v1.0.0-rc2 --no-tags
          python3 archives/1.1.0/experiments/prepare_pair.py "$RUNNER_TEMP/paired"
          python3 -c 'import os,pathlib; p=pathlib.Path("/sys/fs/cgroup/cpu.max"); print("cpus",os.cpu_count(),"quota",p.read_text() if p.exists() else "unreported")' > "$RUNNER_TEMP/paired/host.txt"
          for variant in rc2 v110; do
            (cd "$RUNNER_TEMP/paired/$variant" && go test -p 2 -tags itomtest -c -o "$RUNNER_TEMP/paired/$variant.test" ./tunnel)
          done
      - name: Original probes, tails, sockets and thresholds; strict 100 Mbps target
        env:
          ITOM_HEALTHY_SERVER: "1"
          ITOM_LOAD_COMMAND_DELAY_MS: "0"
          ITOM_LOAD_SERVER_RTT_MS: "${{ matrix.server_rtt }}"
          ITOM_LOAD_SERVER_MBPS: "1000"
          ITOM_LOAD_CLIENT_RTT_MS: "40"
          ITOM_LOAD_CLIENT_MBPS: "500"
          ITOM_LOAD_PROVIDER_MBPS: "500"
          ITOM_LOAD_PROVIDER_SERVICE_MS: "2"
          ITOM_LOAD_LITERAL_PLUS: "${{ matrix.binary }}"
          ITOM_LOAD_BINARY_FETCH: "${{ matrix.binary }}"
          ITOM_LOAD_ACCOUNTS: "10"
          ITOM_LOAD_STREAMS: "${{ matrix.streams }}"
          ITOM_LOAD_RETAINED_STATE: "${{ matrix.retained }}"
          ITOM_LOAD_SECONDS: "60"
          ITOM_LOAD_WARMUP_SECONDS: "2"
          ITOM_LOAD_REPEATS: "2"
          ITOM_LOAD_STARTUP_PROBES: "1"
          ITOM_LOAD_PROBE_CADENCE_MS: "2000"
          ITOM_LOAD_PROBE_DEADLINE_MS: "1500"
          ITOM_REWORK_QUALIFICATION: "1"
          ITOM_RC8_RELEASE_GATE: "1"
          ITOM_LOAD_MIN_MBPS: "100"
          ITOM_LOAD_DIAGNOSTICS: "0"
          ITOM_LOAD_TRACE: "0"
          ITOM_LOAD_SNAPSHOTS: "0"
        run: |
          set -uo pipefail
          failed=0
          order='rc2 v110'; if [ '${{ matrix.retained }}' = 1 ]; then order='v110 rc2'; fi
          for variant in $order; do
            if "$RUNNER_TEMP/paired/$variant.test" -test.run '^TestTransportReworkQualification$' -test.v -test.timeout 600s > "$RUNNER_TEMP/paired/$variant.log" 2>&1; then
              echo "$variant PASS"
            else
              echo "$variant FAIL"; failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v110-throughput-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/paired/*.log
            ${{ runner.temp }}/paired/provenance.json
            ${{ runner.temp }}/paired/host.txt
          retention-days: 90
