name: Publish verified ITOM 1.1.0 final release
on:
  workflow_dispatch:

permissions: {contents: write, actions: read}
concurrency: {group: itom-110-final-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPORT_RUN: 42357660838
      SOURCE_SHA: 474364b115fee38d174e75c0e025a108a5ebc0b9
      RELEASE_ID: 437455679
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require qualified source tag and completed verified export
        run: |
          set -euo pipefail
          test "$(git rev-parse v1.1.0)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- archives/1.1.0/source
          gh api "repos/$GH_REPO/actions/runs/$EXPORT_RUN" > "$RUNNER_TEMP/export.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'export.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v4
        with: {pattern: "ITOM-1.1.0-*", merge-multiple: true, run-id: 42357660838, github-token: "${{ github.token }}", path: release-assets}
      - name: Verify all fourteen exact exported files before release creation
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=json.loads(Path('archives/1.1.0/publication/final/EXPECTED_EXPORTED_ASSETS.json').read_text())
          actual={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in Path('release-assets').iterdir() if p.is_file()}
          assert len(actual)==14 and actual==expected
          m=json.loads(Path('release-assets/ITOM_110_BUILD.json').read_text())
          assert m['source_commit']==os.environ['SOURCE_SHA'] and m['source_tag']=='v1.1.0'
          assert m['release']=='ITOM 1.1.0' and all(m['checks'].values()) and not m['artifact_validation_pending']
          assert Path('release-assets/SOURCE_COMMIT').read_text().strip()==os.environ['SOURCE_SHA']
          PY
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Resume only the existing exact matching final draft
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/draft.json"
          python3 - <<'PYDRAFT'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'draft.json').read_text())
          expected=json.loads(Path('archives/1.1.0/publication/final/EXPECTED_EXPORTED_ASSETS.json').read_text())
          assert r['id']==int(os.environ['RELEASE_ID']) and r['draft'] and not r['prerelease'] and r['tag_name']=='v1.1.0'
          assert {a['name']for a in r['assets']}==set(expected)
          for a in r['assets']:
              assert a['state']=='uploaded' and a['size']==expected[a['name']]['bytes']
              assert a['digest']=='sha256:'+expected[a['name']]['sha256']
          PYDRAFT
      - name: Redownload and verify every GitHub release asset
        run: |
          set -euo pipefail
          gh release download v1.1.0 --dir release-readback
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=json.loads(Path('archives/1.1.0/publication/final/EXPECTED_EXPORTED_ASSETS.json').read_text())
          actual={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in Path('release-readback').iterdir() if p.is_file()}
          assert actual==expected
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'release.json').read_text())
          assert r['draft'] and not r['prerelease'] and r['tag_name']=='v1.1.0'
          assert {a['name']for a in r['assets']}==set(expected)
          for a in r['assets']:
              assert a['size']==expected[a['name']]['bytes'] and a['state']=='uploaded'
              if a.get('digest'):assert a['digest']=='sha256:'+expected[a['name']]['sha256']
          Path('RELEASE_READBACK.json').write_text(json.dumps({'verified':True,'release_id':r['id'],'tag':r['tag_name'],'source_commit':os.environ['SOURCE_SHA'],'assets':[{k:a[k]for k in ('id','name','size','browser_download_url')}for a in r['assets']],'files':actual},indent=2)+'\n')
          PY
      - name: Publish definitive release
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f make_latest=true > FINAL_RELEASE.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('FINAL_RELEASE.json').read_text())
          assert not r['draft'] and not r['prerelease'] and r['tag_name']=='v1.1.0'
          print(r['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ITOM-1.1.0-release-verification, path: "*RELEASE*.json", if-no-files-found: warn}
