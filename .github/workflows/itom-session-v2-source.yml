name: ITOM session v2 source checks (not release qualification)
on:
  push:
    branches: ["codex/v1.1.0-session-transport-v2"]
    paths: ["archives/1.1.0/source/**", ".github/workflows/itom-session-v2-source.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: archives/1.1.0/source/core/go.mod
          cache-dependency-path: |
            archives/1.1.0/source/core/go.sum
            archives/1.1.0/source/native/go.sum
      - name: Independent core scenarios and safety checks
        working-directory: archives/1.1.0/source/core
        run: |
          set -euo pipefail
          go test -race -json ./... | tee "$RUNNER_TEMP/session-v2-core.jsonl"
      - name: Fast preparation and concurrent bulk journals
        if: ${{ !cancelled() }}
        working-directory: archives/1.1.0/source/core
        run: |
          set -euo pipefail
          go test -race -tags itomtest -json ./transport -run '^(TestTenServerWritersDoNotFsyncUnusedGrantsForOneTLSFlight|TestFastPreparationCoordinationKeepsBulkJournalPreparationConcurrent)$' -count=3 -timeout=60s | tee "$RUNNER_TEMP/session-v2-preparation.jsonl"
      - name: Light-load TCP propagation gate
        if: ${{ !cancelled() }}
        working-directory: archives/1.1.0/source/core
        run: |
          set -euo pipefail
          go test -tags itomtest -json ./transport -run '^TestAccountWarmLightPropagationQualification$' -count=1 -timeout=120s | tee "$RUNNER_TEMP/session-v2-light.jsonl"
      - name: Native source and OS TCP primitive checks
        if: ${{ !cancelled() }}
        working-directory: archives/1.1.0/source/native
        run: |
          set -euo pipefail
          go test -race -json ./... | tee "$RUNNER_TEMP/session-v2-native.jsonl"
      - name: Vet both source modules
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          (cd archives/1.1.0/source/core && go vet ./...)
          (cd archives/1.1.0/source/native && go vet ./...)
      - name: Record source-check environment and release boundary
        if: always()
        run: |
          {
            git rev-parse HEAD
            go version
            go env GOOS GOARCH
            getconf _NPROCESSORS_ONLN
            if test -r /sys/fs/cgroup/cpu.max; then cat /sys/fs/cgroup/cpu.max; fi
            printf '%s\n' 'SOURCE CHECKS ONLY. Production initialization remains incomplete; no APK/server package is authorized by this job.'
          } > "$RUNNER_TEMP/session-v2-environment.txt"
      - name: Preserve passing and failing source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-v2-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/session-v2-core.jsonl
            ${{ runner.temp }}/session-v2-native.jsonl
            ${{ runner.temp }}/session-v2-preparation.jsonl
            ${{ runner.temp }}/session-v2-light.jsonl
            ${{ runner.temp }}/session-v2-environment.txt
